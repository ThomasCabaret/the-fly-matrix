[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "the-fly-matrix"
version = "0.1.0"
description = "Auditable MaleCNS-to-MuJoCo virtual Drosophila wiring project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - project license not selected yet" }
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4,<5",
  "pytest>=8,<10",
  "pyyaml>=6,<7",
]
audit = [
  "neuprint-python>=0.5,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "pyarrow>=17,<24",
  "scipy>=1.14,<2",
]
body = [
  "flygym==2.1.0",
]
warp = [
  "flygym[warp]==2.1.0",
]

[project.scripts]
flymatrix = "the_fly_matrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
