status: integration_pass
notes:
  - "Official source: https://github.com/flyconnectome/2025malecns/blob/main/supplemental_data/optic-column-type-assignments-v1.0.xlsx"
  - Biological bodyId-to-column assignment is fixed for the published R7/R8 subset
  - Workbook order is never interpreted as FlyBody ommatidium order
  - The smoke test supplies a deterministic valid registration only to exercise data flow
  - Remaining photoreceptor selections are engineering parameters constrained to the annotated eye
  - HBeyelet mean-light inputs are declared proxies rather than anatomical mappings
  - The former unresolved_values terminal bypass has been removed
  - No scientific phototransduction coefficient has been selected
