acceptance_criteria:
  - Both official workbook sheets contain 1332 distinct represented optic columns
  - Exactly 2628 unique R7/R8 bodyIds match the MaleCNS visual terminal manifest by side and type
  - Pale and yellow column classes accept only compatible FlyBody ommatidium samples
  - One externally supplied injective registration maps represented columns to FlyBody ommatidia within the same eye
  - Exactly 3463 remaining photoreceptors select one externally supplied FlyBody ommatidium from the same eye
  - Exactly 7 HBeyelet terminals use an explicit same-eye mean-light proxy because FlyBody has no eyelet sensor
  - All 6098 terminal activities are computed from physical retinal samples and explicit box parameters
  - No direct terminal activity injection is accepted by the runtime
  - The 4795 discrete registrations and 6098 continuous gains remain external arbitrary smoke values
calibration_dataset_ids: []
held_out_behavior_ids: []
