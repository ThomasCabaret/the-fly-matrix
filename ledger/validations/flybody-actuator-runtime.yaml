name: Adressage et retour physique exécutable de FlyBody
owner_ids:
  - body.flybody
  - world.mujoco
  - sensor.proprioception
  - adapter.motor.transduction
  - wire.motor_transduction_to_body
  - wire.body_to_world
  - wire.body_to_proprioception
level: integration
protocol_path: src/the_fly_matrix/wiring_smoke.py
command: run_wiring_smoke.bat
acceptance_criteria:
  - The resolved runtime actuator type is classical MuJoCo motor for all 102 channels; no position or velocity servo is admitted silently
  - All 102 compiled FlyBody actuators have one unique control address
  - Each actuator targets one unique compiled joint
  - Arbitrary pre-transduced commands are placed deterministically in the ctrl vector
  - Addressed commands are applied to all 102 compiled MuJoCo motor actuators
  - Twenty physics substeps return 102 finite joint positions and velocities
  - Replaying from reset is bit-for-bit deterministic and differs from the passive control
  - The two haltere actuators without specific FlyBody configuration remain explicit
  - Candidate motor-neuron inputs and scientific command values remain separate from exact ctrl addressing
calibration_dataset_ids: []
held_out_behavior_ids: []
latest_run_id: actuator-semantics-20261005T055452Z
status: integration_pass
notes:
  - The current runtime explicitly requests ActuatorType.MOTOR; this avoids an implicit position target but does not validate biological muscle semantics
  - 102 actuator channels target 102 unique joints
  - 100 channels have a FlyBody actuator configuration group and 2 haltere channels do not
  - The smoke-only tanh envelope protects numerical execution and is not a scientific gain
  - The commanded state is read back through the exact 102-channel proprioception interface
  - Candidate mapping and parameter calibration remain separate from exact physical execution
  - The hashed local audit probes all 102 channels against matched passive trajectories; command-force identity, force clipping and nonzero local response pass on every channel
  - The standard scene has four of six legs initially contacting ground and some homologous leg pairs have large response asymmetry, so it is not a symmetric load reference
  - The causal contribution of direct joint actuation remains open until frozen-trace open-loop versus closed-feedback attribution under target.actuator_semantics_gate.v0
