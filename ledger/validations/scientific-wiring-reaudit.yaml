acceptance_criteria:
  - Reconstruct every affected population, grouping and candidate relation directly from raw versioned data and cited primary sources without trusting the current manifest
  - Compare the independent reconstruction with every current group, candidate edge, proxy and exclusion and record all discrepancies
  - Preserve the independently confirmed 17884 input and 815 motor terminal bodyId inventories unless contrary raw evidence is found
  - Classify every reviewed relation as exact, source_supported_candidate, engineering_candidate, proxy, unsupported or removed
  - Replace vague or broken source identifiers with canonical dataset IDs, stable URLs or DOIs and state the exact claim each source supports
  - Keep runtime execution tests separate from scientific acceptance; a passing smoke test cannot satisfy this validation
  - Complete vision, proprioception, mechanosensation and motor workstreams before any affected parameter family enters calibration
  - Rebuild every fine relation family into an empty destination from immutable sources, versioned rules and a versioned singular-exception table without reading the current family
  - Reproduce a canonical semantic relation hash on a repeated clean build with the same declared inputs
  - Quantify candidate-set mean, quantiles and maximum plus discrete routing and continuous transfer degrees of freedom, and block any unjustified cross-sector capacity
  - Test negative anatomical constraints, cardinalities, exclusivity, expected symmetry or documented asymmetry, and supported topography
  - Measure recovery on masked known mappings when a non-circular gold-standard protocol can be defined
  - Freeze topology, candidate-envelope and exception hashes before any affected calibration campaign
