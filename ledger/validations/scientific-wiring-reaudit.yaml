  - proprioception
  - mechanosensation
  - motor_output
next_action: Add clean independent builders for the four fine candidate-edge families, including bounded-capacity metrics, negative constraints, semantic hashes and non-circular gold-standard tests where possible; terminal populations, annotation-backed groups, dispositions and published R7/R8 column relations already pass the rules-first comparison.
notes:
  - Existing integration_pass results prove execution and cardinality only.
  - This review status overrides calibration-oriented next actions on owned records until the validation passes.
  - The first rules-first pass accounted for 12658 unique terminals and 7124 groups with zero unexpected exceptions or membership differences.
  - The official optic supplement independently reproduced all 2628 current R7/R8 bodyId-to-column relations.
  - Proprioceptive, mechanosensory, motor and unregistered-vision fine candidate matrices remain explicitly blocked; this local pass does not accept them.
