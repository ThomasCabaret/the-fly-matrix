reason: A prior annotation-row versus neuron scope error invalidated confidence in the reasoning process used for scientific grouping and candidate construction, even though terminal inventories and runtime execution were subsequently checked.
preserved_claims:
  - Raw files and checksums are reproducible
  - The independently recomputed terminal inventories contain exactly 17884 input and 815 motor bodyIds, all canonical and without overlap
  - The current graph remains executable without direct terminal injection
unaccepted_claims:
  - Current group granularity is biologically optimal
  - Current candidate matrices contain every plausible relation and exclude every implausible relation
  - Current proxy choices are scientifically adequate
  - Current motor groups and actuator candidate sets are ready for calibration
workstreams:
