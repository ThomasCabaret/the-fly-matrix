acceptance_criteria:
  - The six FlyBody leg contact sensors expose seven force torque and presence observables used per leg
  - FlyGym exposes three net world-frame force components for the central thorax and head segments
  - Entry nerve appendage and root side constrain a sparse matrix of 2108 local candidate edges
  - All 323 terminal channels covering 4291 neurons receive represented local candidates
  - Runtime coefficients are injected externally and no scientific value is persisted
  - An empty-destination build from raw annotations, canonical flags and FlyBody sensor inventories reconstructs the full envelope without reading prewiring
  - A repeated clean build reproduces the canonical semantic topology hash
  - Side, leg-position, appendage, segment-locality and mirrored-capacity constraints pass with no exception
