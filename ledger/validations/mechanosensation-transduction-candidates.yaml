schema_version: 1
id: validation.mechanosensation_transduction_candidates
name: Matrice candidate locale de transduction mécanoréceptrice
owner_ids:
  - sensor.touch
  - sensor.proprioception
  - adapter.touch.transduction
  - adapter.touch.routing
  - wire.touch_sensor_to_transduction
  - wire.appendage_motion_to_touch_transduction
  - wire.touch_transduction_to_routing
  - parameter.sensory_transduction
level: integration
protocol_path: src/the_fly_matrix/wiring_smoke.py
command: run_wiring_smoke.bat
acceptance_criteria:
  - The six FlyBody leg contact sensors expose seven force torque and presence observables used per leg
  - FlyGym exposes three net world-frame force components for the central thorax and head segments
  - Entry nerve appendage and root side constrain a sparse matrix of 2108 local candidate edges
  - All 323 terminal channels covering 4291 neurons receive represented local candidates
  - Runtime coefficients are injected externally and no scientific value is persisted
calibration_dataset_ids: []
held_out_behavior_ids: []
latest_run_id: mechanosensation-transduction-candidates-2026-09-22
status: integration_pass
notes:
  - "MaleCNS annotation source: https://github.com/flyconnectome/2025malecns"
  - "MANC nerve nomenclature source: https://pmc.ncbi.nlm.nih.gov/articles/PMC13384506/"
  - "FlyBody kinematic source: https://doi.org/10.1038/s41586-025-09029-4"
  - "Johnston's organ source: https://pmc.ncbi.nlm.nih.gov/articles/PMC4007284/"
  - ProLN MesoLN and MetaLN families identify front middle and hind leg candidate sets
  - Antennal wing haltere and mouthpart candidates use same-side joint position and velocity
  - PDMN notum terminals use the central thorax force and ON peri-optic terminals use the head force
  - Head and thorax mappings are deliberately coarse and do not invent left-right localization
  - Candidate execution is deterministic and is not a calibration
