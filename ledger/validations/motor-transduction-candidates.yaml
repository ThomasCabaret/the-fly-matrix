level: integration
protocol_path: src/the_fly_matrix/wiring_smoke.py
command: run_wiring_smoke.bat
acceptance_criteria:
  - Published broad categories, exit nerves and side constrain 804 motor neurons in 431 groups
  - The sparse matrix contains exactly 7849 candidate edges into all 102 FlyBody actuators
  - Five optic-nerve rm and six accessory-nerve xm neurons remain explicit no-output terminals because FlyBody lacks their effectors
  - Each of the 815 motor channels is assigned to either a candidate edge set or the explicit terminal policy, never both
  - Runtime weights are injected externally and no scientific parameter value is persisted
  - An empty-destination build from raw annotations, canonical population flags, versioned rules, an empty singular-exception table and the FlyBody actuator inventory reproduces all relations without reading prewiring
  - A repeated clean build reproduces the canonical semantic topology hash
  - Side, appendage, actuator coverage and mirrored-capacity constraints pass with no exception
calibration_dataset_ids: []
held_out_behavior_ids: []
latest_run_id: wiring-revalidation-20260928T205213Z
status: integration_pass
scientific_topology_status: independently_validated
semantic_topology_sha256: 0cd753e02283e42f3bf963e3fe223b7728b1a343da5b2db78e6414d4de8c5ca3
notes:
  - Candidate rules use only broad muscle category, published exit-nerve effector and side
  - A free signed gain is exposed for each permitted edge
  - Arbitrary smoke weights verify execution but are never calibration values
  - The independent builder emits 3746 group-to-actuator candidates which expand to the exact 7849 terminal-to-actuator relations already compiled by the runtime
  - All 7849 current relations were independently confirmed; none were added, removed or duplicated
  - No non-circular exact muscle-to-FlyBody-control gold standard exists, so this validates a bounded candidate envelope rather than an exact biological muscle crosswalk
  - Routing capacity and 7849 continuous transfer gains are reported separately; no gain is accepted by this validation
