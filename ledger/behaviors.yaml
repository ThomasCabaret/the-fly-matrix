notes:
  - Technical stability targets are not fly behaviors and cannot support an emergence claim.
  - One named evaluation was executed under immutable protocol v2. It produced an ambiguous, mechanism-limited result and is permanently closed; it did not influence calibration or member selection.
  - Any recognizable behavior used for optimization or selection must be added to behavior_targeted_calibrations and propagated through parameter lineage.
  - Prospective names are not locked held-out protocols; any behavior-specific design or tuning decision contaminates that candidate for the affected lineage.
  - FH-01 selected the front-leg proprioceptive resistance-reflex candidate before any simulated outcome; that selection was not a lock, while FH-08 now supplies the separate immutable protocol and keeps its response properties forbidden to calibration.
  - Mirrored localized leg contact remains prospective but is deferred until independent mechanosensory routing/transfer evidence makes a negative result interpretable.
  - The locked proprioceptive protocol evaluates all eleven FH-07 members as an unranked ensemble; any mixed outcome remains member-conditioned uncertainty.
  - Same-recipe rewired controls retain their complete native survivor sets of 14, 15, 4 and 8 members. Their cardinalities may not be forced to eleven by selection, duplication or omission.
  - Protocol v2 ran all 3,072 episodes. No canonical member-side row passed the primary criterion, all canonical physical rows were masked by joint-limit violations, neural support was left-only and member-dependent, and topology specificity was absent. These outcomes may motivate an attribution audit but never tuning of this lineage against v2.
