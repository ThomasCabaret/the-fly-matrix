    outcome: applied
    relation_class: source_supported_candidate
    terminal_disposition: parameterized
    provenance_kind: literature_supported
    source_references: [malecns-v1.0-body-annotations, https://pmc.ncbi.nlm.nih.gov/articles/PMC12139860/]
    used_claim: Leg hair plates act as joint limit detectors; all same-leg joint positions form a bounded local envelope.

  - id: proprioception.leg-hair-plate-hind.v1
    priority: 120
    selector:
      all:
        - {field: entryNerve, op: equals, value: MetaLN}
        - {field: subclass, op: equals, value: hair plate}
        - {field: rootSide, op: in, value: [L, R]}
    observable_selector: {kind: joint_state, leg_position: hind, components: [position], side_policy: same}
    expected_candidate_count: 11
    outcome: applied
    relation_class: source_supported_candidate
    terminal_disposition: parameterized
    provenance_kind: literature_supported
    source_references: [malecns-v1.0-body-annotations, https://pmc.ncbi.nlm.nih.gov/articles/PMC12139860/]
    used_claim: Leg hair plates act as joint limit detectors; all same-leg joint positions form a bounded local envelope.

  - id: proprioception.generic-leg-front.v1
    priority: 100
    selector:
      all:
        - {field: entryNerve, op: in, value: [ProLN, ProAN, VProN]}
        - {field: subclass, op: in, value: [leg, "(unknown)"]}
        - {field: rootSide, op: in, value: [L, R]}
    observable_selector: {kind: joint_state, leg_position: front, components: [position, velocity], side_policy: same}
    expected_candidate_count: 22
    outcome: applied
    relation_class: anatomy_bounded_candidate
    terminal_disposition: parameterized
    provenance_kind: annotation_supported
    source_references: [malecns-v1.0-body-annotations]
    used_claim: Front-leg nerve and side bound the otherwise unresolved local joint-state envelope.

  - id: proprioception.generic-leg-middle.v1
    priority: 100
    selector:
      all:
        - {field: entryNerve, op: equals, value: MesoLN}
        - {field: subclass, op: equals, value: leg}
        - {field: rootSide, op: in, value: [L, R]}
    observable_selector: {kind: joint_state, leg_position: middle, components: [position, velocity], side_policy: same}
    expected_candidate_count: 22
    outcome: applied
    relation_class: anatomy_bounded_candidate
    terminal_disposition: parameterized
    provenance_kind: annotation_supported
    source_references: [malecns-v1.0-body-annotations]
    used_claim: Middle-leg nerve and side bound the otherwise unresolved local joint-state envelope.

  - id: proprioception.generic-leg-hind.v1
    priority: 100
    selector:
      all:
        - {field: entryNerve, op: equals, value: MetaLN}
        - {field: subclass, op: equals, value: leg}
        - {field: rootSide, op: in, value: [L, R]}
    observable_selector: {kind: joint_state, leg_position: hind, components: [position, velocity], side_policy: same}
