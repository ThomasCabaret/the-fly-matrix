negative_constraints:
  - every selected terminal is canonical and belongs to exactly one group
  - every group matches exactly one highest-priority rule
  - every group has exactly the rule-declared candidate count
  - appendage candidates never cross the annotated root side
  - leg candidates never cross front, middle or hind position implied by the nerve
  - proxy and parameterized group memberships are disjoint and exhaustive
  - specialized FeCO claw, hook and club rules override the generic chordotonal rule

gold_standard:
  applicable: false
  reason: >-
    No independent receptor-to-FlyBody-observable pointwise crosswalk exists. The
    literature supports modality-local envelopes, while FlyBody's aggregate joint
    states require explicit proxies for strain receptors.

known_limits:
  - Joint states do not reproduce campaniform or notum strain fields.
  - Candidate membership is structural; gains, thresholds, signs, delays and dynamics remain uncalibrated.
  - Generic leg groups retain all local joint states where annotations do not resolve a narrower receptor modality.
  - The central unlocalized campaniform group is deliberately coarse and cannot support a sided claim.
