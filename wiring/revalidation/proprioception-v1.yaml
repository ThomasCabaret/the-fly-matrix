  - id: proprioception.neck-chordotonal.v1
    priority: 110
    selector:
      all:
        - {field: entryNerve, op: equals, value: ProCN}
        - {field: subclass, op: equals, value: chordotonal organ}
    observable_selector: {kind: joint_state, body_group: head, components: [position, velocity], side_policy: any}
    expected_candidate_count: 6
    outcome: applied
    relation_class: source_supported_candidate
    terminal_disposition: parameterized
    provenance_kind: literature_supported
    source_references: [malecns-v1.0-body-annotations, https://www.nature.com/articles/s41586-024-07222-5]
