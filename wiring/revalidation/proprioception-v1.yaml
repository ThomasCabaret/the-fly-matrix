    observable_selector: {kind: joint_state, body_group: head, components: [position, velocity], side_policy: any}
    expected_candidate_count: 6
    outcome: applied
    relation_class: anatomy_bounded_candidate
    terminal_disposition: parameterized
    provenance_kind: annotation_supported
    source_references: [malecns-v1.0-body-annotations]
