  - id: proprioception.leg-hair-plate-front.v1
    priority: 120
    selector:
      all:
        - {field: entryNerve, op: in, value: [ProLN, DProN, VProN]}
        - {field: subclass, op: equals, value: hair plate}
        - {field: rootSide, op: in, value: [L, R]}
