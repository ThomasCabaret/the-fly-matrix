schema_version: 1
id: model.malecns_lif_source_aligned.v1
title: Source-aligned fixed-delay event LIF comparator for canonical MaleCNS
status: engineering_reference_unfitted
claim_label: EVENT MODEL GATE / SOURCE-ALIGNED / UNFITTED / NOT BIOLOGICAL BEHAVIOR
scientific_role: bounded_model_class_comparator

supersedes_for_future_gate_runs: model.malecns_lif_fixed_delay.v0
supersession_reason: >-
  The v0 implementation copied the published constants but did not reproduce two
  declared Brian2 semantics: g is reset to zero after a spike and both v and g
  are frozen while the neuron is refractory. It also used a split Euler update
  rather than the source's linear integrator. The v0 benchmark remains an honest
  engineering throughput record and is not rewritten retroactively.

scope:
  canonical_neurons: 166700
  runtime_edges: 25582938
  structural_weight: published_integer_synapse_count
  edge_partition_key: presynaptic_effective_transmitter

equations:
  active_state:
    - dv/dt = (v_rest - v + g) / tau_membrane
    - dg/dt = -g / tau_syn
  refractory_state: freeze_v_and_g
  spike: eligible and v > threshold_mV
  reset: v = reset_mV; g = 0; refractory = refractory_ms
  transmission: every emitted spike is delivered after fixed_delay_ms
  numerical_scheme: brian2_default_schedule_state_update_threshold_synapses_reset
  scheduler_conformance: >-
    Direct Python 3.10 / Brian2 2.5.1 probes agree at 1e-9 mV tolerance for
    coupled linear integration, threshold/reset, refractory release and delayed
    event visibility. See runner_result.neural_model_class_brian2_conformance.v1.

reference_constants:
  v_rest_mV: {value: -52.0, origin: pinned_published_source}
  reset_mV: {value: -52.0, origin: pinned_published_source}
  threshold_mV: {value: -45.0, origin: pinned_published_source}
  tau_membrane_ms: {value: 20.0, origin: pinned_published_source}
  tau_syn_ms: {value: 5.0, origin: pinned_published_source}
  refractory_ms: {value: 2.2, origin: pinned_published_source}
  fixed_delay_ms: {value: 1.8, origin: pinned_published_source}
  unitary_synaptic_weight_mV:
    value: 0.275
    origin: published_behavior_exposed_fit
    restriction: comparison_only_not_promotable_without_independent_evidence

source_lock:
  repository: https://github.com/philshiu/Drosophila_brain_model
  commit: 91bdd1e7dcf193f3e7ca5a8933497fcef63b7960
  files:
    model.py: b879a8a286f367165e3effa6d47562cac289333c977be7716ccb646067326cce
    figures.ipynb: 16fa15a05378dd6be348925f3ccfe6e0eb02c560f06dcc81d6ea4c5267f37f0b
    environment.yml: cce8225d6fe9574f5c86cc3ecb13d5577c1267a5c0801f1af9e9a3b880db1836
  source_runtime:
    python: '3.10'
    brian2: 2.5.1
    isolation_policy: reproduce_in_a_dedicated_environment_not_the_project_python_3_12_venv

engineering_choices:
  dt_ms:
    value: 0.1
    reason: matches the pinned source's Brian2 default-clock resolution in the reference environment and exactly resolves delay and refractory durations
    status: numerical_choice_to_conformance_test
  unknown_transmitter_signs:
    policy: reuse_explicit_nonzero_structural_probe_signs
    restriction: throughput_and_software_validation_only
  full_graph_load:
    policy: deterministic_forced_spike_schedule
    restriction: not_a_neural_activity_or_behavior_claim

accepted_claims:
  - The implementation exposes spike, membrane, synaptic, refractory and delay state.
  - Its equations, reset, refractory freeze and constants are traceable to the pinned source.
  - Every forced or endogenous event can be accounted against the canonical outgoing graph.
  - The implementation conforms to Brian2 2.5.1 on the preregistered scheduler-boundary fixtures.
forbidden_claims:
  - The constants are accepted MaleCNS physiology.
  - The unitary weight is behavior-independent.
  - A throughput pass validates neural computation or fly behavior.
  - A fixed delay establishes that morphology-dependent delays are unnecessary.

critical_risk_refs:
  - risk.central_delay_fidelity.v0
  - risk.central_event_model_fidelity.v0
next_action: Use only inside target.population_dynamics_assignment.v0 or an explicit dual-unresolved comparison; do not promote it globally or reuse the behavior-exposed unitary weight as physiology.
