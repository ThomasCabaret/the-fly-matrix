schema_version: 1
id: catalog.prospective_emergent_behavior_evaluations.v0
title: Prospective behavior-naive observation catalog
status: prospective_catalog_one_candidate_promoted_to_locked_protocol_not_run
created: 2026-10-03
primary_class: evaluation_only_candidate_catalog
optimization_exposure: forbidden
claim_label: PROSPECTIVE HELD-OUT CANDIDATES / NOT A PROTOCOL / NOT RUN

purpose: >-
  Preserve candidate observations that may test whether insect-like or fly-like
  structure emerges after calibration without using those observations to choose
  parameters, topology, model capacity or trials.

catalog_exposure_policy:
  catalog_registration_is_protocol_lock: false
  catalog_registration_is_outcome_exposure: false
  use_for_loss_or_selection: forbidden
  behavior_specific_design_change_contaminates_lineage: true
  future_protocol_requirements:
    - immutable scene and body contract
    - stimulus generator, timing, intensity and seeds
    - metrics, thresholds and exclusions
    - analysis and topology-control hashes
    - frozen parameter-set lineage

planning_priority:
  status: promoted_to_protocol_v0_execution_pending
  preferred_first_candidate: evaluation_candidate.front_leg_proprioceptive_resistance_reflex.v0
  preferred_variant: mirrored_passive_front_tibia_displacement
  prerequisites:
    - accepted bounded FeCO-to-motor chain ensemble
    - accepted actuator semantics gate
    - mechanism-coverage statement
    - independent biological sources and immutable protocol
  rationale: >-
    FH-01 selected a separately sourced proprioceptive resistance-reflex
    candidate before any simulated outcome was generated. It reuses an already
    bounded front-leg FeCO-to-motor envelope and has fewer unbounded interface
    degrees of freedom than localized contact.
  current_readiness_gap: >-
    Protocol v0 is locked over the complete eleven-member FH-07 ensemble but has
    not been executed. FH-09 must materialize and hash the topology controls and
    exact schedule before opening outcomes. The tactile candidate is deferred,
    not rejected: its 323 groups, 2108 bounded route candidates, up to 1785
    routing dimensions and absent admitted local dataset still prevent an
    interpretable first negative result.
  selection_record: calibration/evaluations/first-held-out-channel-readiness-v0.yaml
  alternative_policy: >-
    Reopening tactile or selecting another modality requires a roadmap revision
    based on independent evidence and mechanism coverage before any outcome is
    inspected.
  deferred_confounders:
    localized_grooming: current tactile resolution and full action-sequence interpretation
    optomotor: unresolved visual registration
    looming_takeoff: visual, flight-mechanics and missing electrical-coupling ambiguity
  lineage_warning: >-
    Antennal grooming is not cleanly held out for a lineage whose neural-model
    choice used the antennal grooming circuit reference.

candidates:
  - id: evaluation_candidate.localized_grooming.v0
    stimulus_family: localized_mechanical_contact
    observation: region-appropriate limb recruitment with left/right specificity
    status: prospective_not_locked
    suggested_metrics: [limb_region_specificity, mirrored_side_preference, latency, repeatability, sham_effect_size]
  - id: evaluation_candidate.grooming_hierarchy.v0
    stimulus_family: simultaneous_multi_region_mechanical_contact
    observation: reproducible ordering of cleaning-like responses across regions
    status: prospective_not_locked
    suggested_metrics: [response_order, priority_consistency, region_specificity, sham_effect_size]
  - id: evaluation_candidate.looming_escape.v0
    stimulus_family: expanding_visual_object
    observation: bounded directionally coherent escape-like or takeoff-preparation response
    status: prospective_not_locked
    mechanism_coverage: electrical_coupling_and_flight_mechanics_require_audit
    suggested_metrics: [direction_relative_to_stimulus, latency, repeatability, sham_effect_size]
  - id: evaluation_candidate.sensorimotor_lateralization.v0
    stimulus_family: mirrored_tactile_or_visual_stimuli
    observation: mirror-equivariant and anatomically coherent motor-response distributions
    status: prospective_not_locked
    planning_priority: deferred_until_mechanosensory_local_evidence_exists
    preferred_variant: mirrored_localized_leg_contact
    suggested_metrics: [mirrored_output_equivariance, ipsilateral_contralateral_specificity, paired_effect_size]
  - id: evaluation_candidate.front_leg_proprioceptive_resistance_reflex.v0
    stimulus_family: passive_front_leg_femur_tibia_displacement
    observation: >-
      A bounded time-locked motor and physical response that tends to oppose a
      passive tibia displacement, differs from sham and preserves declared
      left/right organization.
    status: promoted_to_locked_protocol_v0_not_run
    protocol_ref: calibration/protocols/first-held-out-proprioceptive-resistance-reflex-v0.yaml
    planning_priority: selected_first_FH08_complete_FH09_pending
    source_refs:
      - https://doi.org/10.7554/eLife.56754
      - https://doi.org/10.1016/j.neuron.2018.09.009
    calibration_exclusion: >-
      Perturbation-response direction, latency, spatial specificity and body
      motion may not select any parameter or candidate in this lineage.
    shared_source_warning: >-
      The motor publication also supports spike-to-force and event-capability
      evidence elsewhere. Only those local claims may enter calibration; its
      resistance-reflex observations remain evaluation-only.
    suggested_metrics: [response_opposition_to_displacement, latency_relative_to_sham, boundedness_and_recovery, mirrored_side_equivariance, scoped_motor_population_specificity]
  - id: evaluation_candidate.optomotor_response.v0
    stimulus_family: directional_visual_field_motion
    observation: coherent yaw or turning tendency related to motion direction
    status: prospective_not_locked
    suggested_metrics: [directional_turning_index, mirrored_equivariance, latency, sham_effect_size]
  - id: evaluation_candidate.optomotor_temporal_dynamics.v0
    stimulus_family: prolonged_directional_visual_motion
    observation: preregistered adaptation, delayed modification or reversal beyond instantaneous gain
    status: prospective_requires_biological_source_and_locked_time_metric
    suggested_metrics: [time_resolved_directional_index, adaptation_constant, delayed_sign_change, recovery]
  - id: evaluation_candidate.structured_spontaneous_motor_activity.v0
    stimulus_family: nominal_no_stimulus
    observation: occasional repeatable motor motifs defined independently before trajectory inspection
    status: prospective_exploratory_requires_locked_independent_motif_detector
    suggested_metrics: [motif_rate, motif_repeatability, boundedness, topology_control_gap]

required_control_families:
  - sham_or_no_stimulus
  - behavior_naive_calibrated_malecns
  - frozen_parameter_topology_control_ensemble
  - recipe_matched_recalibrated_topology_control_ensemble

topology_control_policy:
  same_interfaces_body_stimulus_and_analysis: true
  multiple_rewire_seeds_required: true
  preserve_where_relevant: [directed_degree, weight_distribution, sign_or_transmitter_class_counts, interface_cardinalities]
  optional_targeted_controls: [pathway_scramble, module_scramble]
  behavior_used_during_control_calibration: forbidden

cross_protocol_metrics:
  - effect_size_relative_to_sham
  - repeatability
  - latency
  - boundedness_and_recovery
  - directional_or_anatomical_specificity
  - uncertainty_across_seeds_and_central_ensemble
  - gap_from_topology_controls

provenance:
  source_kind: user_proposed_project_catalog
  registered_date: 2026-10-03
  biological_sources_attached: false
  note: Numerical expectations and thresholds require sourced preregistration before any protocol is locked.

validation: not_run
next_action: Audit localized leg-contact resolution, minimal mechanosensory-chain readiness and mechanism coverage after a runnable lineage is frozen; keep all catalog outcomes unavailable during calibration and source any alternative before registration.
