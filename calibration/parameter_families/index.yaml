accounting:
  total_families: 23
  by_kind: {basal: 6, routing: 4, transfer: 8, neural_dynamics: 3, mechanical: 1, technical_nuisance: 1}
  by_claim_role: {biological: 12, surrogate: 10, technical: 1}
  frozen_external: 1
  accepted_parameter_sets: 1
  fitted_families: 0
  frozen_parameter_families: 2
  unresolved_or_unfrozen_families: 21

known_runtime_couplings:
  - families: [parameter.central.synaptic_efficacy.v0, parameter.central.neuron_dynamics.v0, parameter.central.native_boundary_conversion.v0]
    issue: Full-graph sentinels currently pass four boundary scales in one runtime constants object.
    required_resolution: Keep same-native efficacy, cross-native conversion and neuron dynamics as separate lineage owners even when one joint campaign identifies them.
  - families: [parameter.proprioception.routing.v0, parameter.proprioception.transfer.v0]
    issue: One executable coefficient vector currently combines route weighting and transfer gain.
    required_resolution: Compile distinct logical families into the existing runtime vector.
  - families: [parameter.proprioception.transfer.v0, parameter.proprioception.native_bridge.v0, parameter.central.synaptic_efficacy.v0, parameter.central.neuron_dynamics.v0]
    issue: Calcium constrains local activation shape, while native amplitude can compensate with efficacy and threshold.
    required_resolution: Freeze the shape coordinate separately and identify or propagate native amplitude only in the explicit FH-05 coupled gate.
  - families: [parameter.mechanosensation.routing.v0, parameter.mechanosensation.transfer.v0]
    issue: One executable coefficient vector currently combines route weighting and transfer gain.
    required_resolution: Compile distinct logical families into the existing runtime vector.
  - families: [parameter.motor.routing.v0, parameter.motor.transfer.v0]
    issue: The terminal-actuator matrix currently combines route weighting and activation gain.
    required_resolution: Compile distinct logical families into the existing runtime matrix.

milestone_boundary:
  name: first_scientifically_interpretable_closed_loop
  required_before_run_claim:
    - Evidence/sign compiler reports coverage and unknown masks.
    - Every non-external family consumed by the run has a frozen parameter set or an explicit unresolved exclusion.
    - Routing and transfer are compiled separately even when the runtime representation is shared.
    - Technical neural and embodied stability gates pass without named-behavior optimization.
    - The held-out stimulus/sham protocol is locked before inspection.
  not_required_for_first_milestone:
    - Individual per-neuron or per-edge physiological identification.
    - Exhaustive behavior repertoire.
    - Recalibration of FlyBody mechanical constants.

next_action: >-
  Propagate the explicit proprioception native bridge together with source
  intensity, central efficacy, internal native-boundary conversion and neuron
  dynamics in FH-05. No local physiological value is promoted by the inventory.
