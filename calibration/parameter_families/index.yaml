schema_version: 1
id: parameter_family_inventory.v0
status: complete_inventory_values_unfitted
updated: 2026-10-17
scope_statement: >-
  Exhaustive inventory of parameter families currently exposed or required by
  the accepted wiring-v0 embodied runtime. Completeness means every known family
  has a record; it does not mean values, sharing levels, models, or routes have
  been selected.

