accepted_claims:
- All 81 preregistered owner rows execute under paired stimulus and sham conditions.
- Both all-graded and all-event basal port mirrors execute for every row.
- The bounded graph contains the real direct basal boundary and recurrent cone edges
  and no outside recurrence.
- Main-effect signatures expose local observability and possible compensation under
  the declared fixtures.
- The complete finite technical execution ensemble can be propagated member-conditionally
  without selecting a reference.
forbidden_claims:
- Any owner level is a physiological value, prior, accepted bound, or preferred member.
- The finite technical ensemble covers the 2^184 population assignment space or higher-order
  interactions.
- Direct basal boundary edges reproduce recurrent outside-cone context.
- A nonzero response, threshold crossing, or bounded trace identifies a parameter.
- This campaign establishes embodied stability, a behavior, or a biological reference
  lineage.
