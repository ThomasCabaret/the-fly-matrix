claim_label: DESCRIPTIVE TECHNICAL METRICS / NOT STABILITY / NO BEHAVIOR

acceptance_result: pass_metric_extraction_stability_unresolved
acceptance_scope:
  accepted:
    - checksum-pinned physical trajectory loads under schema v1
    - seven declared descriptive metric groups are computed
    - unavailable scientific quantities are explicit rather than zero-filled
    - zero parameters, thresholds, topology changes or behavior targets are exposed
  not_accepted:
    - embodied stability
    - recovery after perturbation
    - joint-limit safety
    - center-of-mass stability
    - biological actuator energy or muscle fidelity
    - any behavioral interpretation of the observed motion

descriptive_baseline:
