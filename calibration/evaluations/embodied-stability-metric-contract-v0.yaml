  frames_without_ground_contact: 4
  ground_contact_transition_count: 261
  maximum_command_abs: 0.00005727000461774878
  note: >-
    These values characterize one uncalibrated engineering comparator. No bound
    above is an acceptance threshold and no direction is labelled biologically
    desirable.

coverage_gap:
  joint_limits: trajectory schema v1 does not snapshot limits
  center_of_mass: root generalized position is not COM
  perturbation_recovery: requires matched baseline and perturbed trajectories
  body_jerk: command slew is not physical jerk
  energy: direct MOTOR force-velocity integral is not biological energy

