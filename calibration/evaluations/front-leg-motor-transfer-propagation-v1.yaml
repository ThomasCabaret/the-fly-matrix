limitations:
- The slow envelope is post-inspection, one-cell and touches the tau and delay grid
  boundaries.
- Fast and intermediate envelopes are also one-cell diagnostics and the intermediate
  fit is weak.
- No individual MaleCNS body has an experimental motor-class crosswalk.
- Execution completeness is not physiological validation or motor calibration.
accepted_claims:
- Every one of the 59,049 factorized ten-body class assignments now has a class-distinct
  executable event-to-force representation.
- The 58,025 slow-containing assignments are propagated through the exact finite 338-member
  diagnostic slow envelope rather than a borrowed twitch or zero.
- Body class, temporal candidate, actuator route and force-to-MuJoCo gain remain separate
  unselected axes.
forbidden_claims:
- The slow envelope is an independently validated biological population kernel.
- A best candidate, body-class assignment, route or actuator gain is a runtime default
  or reference.
- Motor transfer is calibrated from body motion or from the future held-out response.
next_action: Hand the complete factorized motor-transfer envelope to FH-05 and keep
  it fixed while the coupled central, basal and native-boundary identifiability gate
  is evaluated.
