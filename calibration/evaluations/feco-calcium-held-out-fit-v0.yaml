scientific_boundary:
  accepted_claims:
    - The procedure can account for rows, groups, source candidates and folds without reading a named behavior.
    - Predictions reset at every animal/trial/ROI boundary and held-out calcium never sets normalization or affine values.
    - All seven preregistered candidates completed all 86 animal-held-out folds on the exact source tables.
    - The hook minus-5-degree-per-second source recipe has lower aggregate held-out residuals than the documented minus-50-degree-per-second application path in this observation-space comparison.
  rejected_claims:
    - Synthetic fixtures constitute a biological FeCO fit.
    - Calcium identifies a native spike, membrane-voltage or CNS-runtime representation.
    - A best residual may silently select or promote a source path.
    - These residuals alone justify a runtime parameter set, an individual MaleCNS body mapping, or a native event-versus-graded assignment.

