conclusion: All 6,041 basal terminals now compile through explicit event-process and
  bounded Hz-to-graded candidate bridges. All three preregistered low-capacity shapes
  execute under both diagnostic assignment extremes with complete accounting, finite
  state and no named behavior. The fixture rates, saturation scale and neuronal assignments
  are unpromotable engineering probes, so this does not calibrate basal activity or
  select population dynamics.
accepted_claims:
- All 6,041 basal terminals have executable candidate bridges for event and graded
  ports.
- All three preregistered low-capacity input shapes execute under both diagnostic
  assignment extremes.
- Event sampling is seeded and collision risk is bounded by an explicit per-step presence
  limit.
- The graded conversion is explicit, zero-preserving, monotone and bounded.
forbidden_claims:
- Any diagnostic rate, scale, seed or time course is physiological, fitted or accepted.
- Either assignment extreme identifies native dynamics for any dual-unresolved population.
- Independent Poisson sources or the saturating conversion are biologically validated.
- Finite execution calibrates a basal family, central dynamics, stability or behavior.
- Any named behavior has been trained, evaluated or visually selected.
