  mixed_reference_unknown_family_ablation_motor_event_g_l1_absolute_fraction: 0.893
  mixed_reference_unknown_family_ablation_motor_state_max_absolute_fraction: 0.889
  short_horizon_all_event_reference_motor_probe_is_zero: true
  long_horizon_all_event_probe_nonzero_by_group:
    sensory_36: true
    intermediate_150: true
    motor_10: true
  long_horizon_all_event_generated_internal_events: 0
  interpretation: Under engineering fixtures only, the unknown-modality family dominates
    the mixed-profile motor-probe sensitivity. The event profile reaches all local
    probe groups only at the longer horizon and remains subthreshold for internally
    generated events. Neither finding selects a profile or establishes physiology.
