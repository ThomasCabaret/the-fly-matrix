status: accepted_technical_sensitivity_only_scientific_basal_values_unresolved
conclusion: The finite behavior-naive engineering envelope and all family ablations
  execute through both candidate source-port profiles. The mixed profile reaches the
  frozen local-chain probe within 9.6 ms and is strongly fixture-sensitive to the
  unknown-modality family. The all-event profile reaches all three probe groups at
  96 ms but produces no internal threshold crossing under the diagnostic constants.
  No member is ranked and no numerical value, conversion scale or population assignment
  is promoted as physiology.
