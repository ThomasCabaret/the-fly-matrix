accepted_claims:
- A finite engineering envelope spans both candidate source-port profiles and all
  six families.
- Every member executes through the full graph and is observed at the frozen 196-neuron
  local-chain probe.
- Leave-one-family-out diagnostics expose whether a family, including unknown afferents,
  materially changes the local probe under the declared fixtures.
- The complete member list and every result are retained without ranking or selection.
forbidden_claims:
- The technical coordinates are physiological estimates, priors or accepted bounds.
- A low-sensitivity ablation proves that a basal family is biologically irrelevant.
- A high-sensitivity ablation identifies a correct source magnitude or neuronal assignment.
- Local-chain activity establishes local function, embodied stability or behavior.
- Either assignment profile is biologically preferred.
next_action: Inspect the preregistered family-ablation sensitivity without ranking
  members. Independently source or justify scientific bounds for the families that
  dominate the local probe; where evidence remains unavailable, carry this finite
  technical uncertainty into the first whole-body typed/hybrid sentinel rather than
  silently choosing one value or population assignment.
