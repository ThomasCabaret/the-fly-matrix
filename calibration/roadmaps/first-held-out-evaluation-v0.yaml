schema_version: 1
id: roadmap.first_held_out_evaluation.v0
revision: 5
updated: 2026-10-19
status: active

milestone:
  title: First end-to-end behavior-naive held-out evaluation
  objective: >-
    Freeze one runnable MaleCNS lineage calibrated without the evaluated response,
    then execute one immutable evaluation-only stimulus/sham protocol with the
    declared topology controls.
  definition_of_done:
    - one runnable lineage is frozen with topology, parameter, mechanism and exposure hashes
    - one independently sourced evaluation-only protocol is locked before outcomes are viewed
    - stimulus, sham and relevant mirrored trials execute end to end
    - frozen-parameter and same-recipe recalibrated topology controls execute
    - the result is reported as positive, negative or ambiguous without tuning the lineage afterward
  not_required_for_completion:
    - a positive or naturalistic behavior result
    - global assignment of all dual-unresolved MaleCNS populations
    - calibration of every sensory modality or every motor branch
  forbidden_shortcuts:
    - selecting any calibration member from the held-out response or attractive body motion
    - treating FeCO proprioception as a calibrated tactile interface
    - borrowing a fast or intermediate motor kernel for an unresolved slow class
    - promoting diagnostic event/graded conversion constants

selected_planning_path:
  candidate_id: evaluation_candidate.front_leg_proprioceptive_resistance_reflex.v0
  decision_ref: calibration/evaluations/first-held-out-channel-readiness-v0.yaml
  protocol_ref: calibration/protocols/first-held-out-proprioceptive-resistance-reflex-v2.yaml
  status: protocol_v2_native_control_schedule_locked_execution_ready
  selection_basis: independent_biology_and_current_mechanism_readiness
  simulated_outcomes_inspected_for_selection: false
  displaced_preference:
    candidate_id: evaluation_candidate.sensorimotor_lateralization.v0
    variant: mirrored_localized_leg_contact
    disposition: deferred_not_rejected
    reason: no_admitted_local_mechanosensory_calibration_dataset_or_transfer_representation

estimate_contract:
  unit: substantial_agent_delivery_batch
  unit_definition: >-
    One coherent implementation, evidence, campaign, or gate delivery with status,
    tests and a local commit. It is not one shell command, one compute run or one
    calendar day.
  open_items: 1
  base_work_batches: {min: 1, max: 1}
  contingency_batches: {min: 2, max: 4}
  planning_forecast_batches: {min: 3, max: 5}
  confidence: low_to_medium
  estimate_scope: >-
    First interpretable held-out attempt, not a guaranteed positive behavior and
    not total calibration of MaleCNS.
  assumptions:
    - one existing candidate modality becomes defensible without commissioning a new biological experiment
    - current GPU, MuJoCo and source repositories remain available
    - the bounded causal cone does not expand to most of MaleCNS
    - accepted wiring and actuator semantics remain valid
  excluded_from_batch_forecast:
    - elapsed offline compute time once an existing runner can execute autonomously
    - waiting for credentials or inaccessible external archives
    - commissioning or producing new experimental biology
    - a post-evaluation scientific revision after the first result

items:
