    title: Select and justify the first evaluable local channel
    nature: evidence_and_readiness_gate
    status: complete
    depends_on: []
    estimated_batches: {min: 1, max: 1}
    exit_criteria:
      - tactile stimulus resolution, mechanism coverage and admitted evidence are audited
      - tactile remains preferred or a sourced proprioceptive candidate is prospectively registered
      - the choice uses readiness and biology, never a simulated outcome
    replan_if: no candidate has sufficient independent local evidence
    completion_record:
      evaluation_ref: calibration/evaluations/first-held-out-channel-readiness-v0.yaml
      outcome: proprioceptive_resistance_reflex_selected_tactile_deferred
      simulated_outcomes_inspected: false

