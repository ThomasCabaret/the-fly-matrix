        these fixtures. All members remain unranked and unselected; zero value,
        population assignment, route or behavior is promoted.
      retained_uncertainty: >-
        81 owner-separated technical members times two source-native mirrors;
        unsampled higher-order population assignments and outside-cone recurrence
