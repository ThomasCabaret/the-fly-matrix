    status: complete
    depends_on: [FH-01]
    estimated_batches: {min: 1, max: 1}
    exit_criteria:
      - every included population and internal native boundary is accounted
      - exclusions and the relationship to the 166419 dual-unresolved neurons are explicit
      - topology and exception hashes are frozen
    replan_if: the cone is not materially smaller or cannot be bounded without outcome inspection
    completion_record:
