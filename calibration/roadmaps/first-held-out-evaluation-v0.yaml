        source combinations are frozen. Native representation capacity is widened
        from one global binary choice to all eight class-shared claw/club/hook
        profiles, yielding 1,728 factorized members without a reference selection.
        Calcium cannot identify native amplitude, so that capacity is a separate
        named family handed to the already planned FH-05 coupled gate rather than
        a hidden default or an invented standalone prior.
      locally_frozen_family_ids:
