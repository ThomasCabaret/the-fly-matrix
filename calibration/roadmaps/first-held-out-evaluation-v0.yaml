      parameter_set_id: parameters.front_leg_feco_sensory_ensemble.v1
      evaluation_ref: calibration/evaluations/feco-native-bridge-factorization-v0.yaml
      outcome: >-
        Twenty-six of 36 scoped bodies have exact published type aliases. The ten
        remaining bodies are propagated as three type-shared variables, yielding
