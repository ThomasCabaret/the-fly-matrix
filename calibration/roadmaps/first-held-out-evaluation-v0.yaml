schema_version: 1
id: roadmap.first_held_out_evaluation.v0
revision: 1
updated: 2026-10-17
status: active

milestone:
  title: First end-to-end behavior-naive held-out evaluation
  objective: >-
    Freeze one runnable MaleCNS lineage calibrated without the evaluated response,
    then execute one immutable evaluation-only stimulus/sham protocol with the
    declared topology controls.
  definition_of_done:
    - one runnable lineage is frozen with topology, parameter, mechanism and exposure hashes
    - one independently sourced evaluation-only protocol is locked before outcomes are viewed
    - stimulus, sham and relevant mirrored trials execute end to end
    - frozen-parameter and same-recipe recalibrated topology controls execute
    - the result is reported as positive, negative or ambiguous without tuning the lineage afterward
  not_required_for_completion:
    - a positive or naturalistic behavior result
    - global assignment of all dual-unresolved MaleCNS populations
    - calibration of every sensory modality or every motor branch
  forbidden_shortcuts:
    - selecting any calibration member from the held-out response or attractive body motion
    - treating FeCO proprioception as a calibrated tactile interface
    - borrowing a fast or intermediate motor kernel for an unresolved slow class
    - promoting diagnostic event/graded conversion constants

selected_planning_path:
  candidate_id: evaluation_candidate.front_leg_proprioceptive_resistance_reflex.v0
  decision_ref: calibration/evaluations/first-held-out-channel-readiness-v0.yaml
  status: prospective_not_locked_not_run
  selection_basis: independent_biology_and_current_mechanism_readiness
  simulated_outcomes_inspected_for_selection: false
  displaced_preference:
    candidate_id: evaluation_candidate.sensorimotor_lateralization.v0
    variant: mirrored_localized_leg_contact
    disposition: deferred_not_rejected
    reason: no_admitted_local_mechanosensory_calibration_dataset_or_transfer_representation

estimate_contract:
  unit: substantial_agent_delivery_batch
  unit_definition: >-
    One coherent implementation, evidence, campaign, or gate delivery with status,
    tests and a local commit. It is not one shell command, one compute run or one
    calendar day.
  open_items: 4
  base_work_batches: {min: 4, max: 6}
  contingency_batches: {min: 2, max: 4}
  planning_forecast_batches: {min: 6, max: 10}
  confidence: low_to_medium
  estimate_scope: >-
    First interpretable held-out attempt, not a guaranteed positive behavior and
    not total calibration of MaleCNS.
  assumptions:
    - one existing candidate modality becomes defensible without commissioning a new biological experiment
    - current GPU, MuJoCo and source repositories remain available
    - the bounded causal cone does not expand to most of MaleCNS
    - accepted wiring and actuator semantics remain valid
  excluded_from_batch_forecast:
    - elapsed offline compute time once an existing runner can execute autonomously
    - waiting for credentials or inaccessible external archives
    - commissioning or producing new experimental biology
    - a post-evaluation scientific revision after the first result

items:
  - id: FH-01
    title: Select and justify the first evaluable local channel
    nature: evidence_and_readiness_gate
    status: complete
    depends_on: []
    estimated_batches: {min: 1, max: 1}
    exit_criteria:
      - tactile stimulus resolution, mechanism coverage and admitted evidence are audited
      - tactile remains preferred or a sourced proprioceptive candidate is prospectively registered
      - the choice uses readiness and biology, never a simulated outcome
    replan_if: no candidate has sufficient independent local evidence
    completion_record:
      evaluation_ref: calibration/evaluations/first-held-out-channel-readiness-v0.yaml
      outcome: proprioceptive_resistance_reflex_selected_tactile_deferred
      simulated_outcomes_inspected: false

  - id: FH-02
    title: Compile the bounded stimulus-to-readout causal population cone
    nature: rules_first_scope_compilation
    status: complete
    depends_on: [FH-01]
    estimated_batches: {min: 1, max: 1}
    exit_criteria:
      - every included population and internal native boundary is accounted
      - exclusions and the relationship to the 166419 dual-unresolved neurons are explicit
      - topology and exception hashes are frozen
    replan_if: the cone is not materially smaller or cannot be bounded without outcome inspection
    completion_record:
      scope_ref: calibration/scopes/first-held-out-proprioceptive-resistance-reflex-v0.yaml
      evaluation_ref: calibration/evaluations/first-held-out-causal-cone-v0.yaml
      population_accounting: 196_total_12_event_required_184_dual_unresolved
      canonical_neurons_outside_local_claim: 166504
      simulated_outcomes_consumed: false

  - id: FH-03
    title: Calibrate and freeze the minimal sensory chain
    nature: local_interface_calibration
    status: complete
    depends_on: [FH-01, FH-02]
    estimated_batches: {min: 1, max: 1}
    exit_criteria:
      - routing and transfer capacity are independently justified and versioned
      - local train/validation evidence is admitted with units and uncertainty
      - the retained parameter set or ensemble is frozen without held-out behavior exposure
    replan_if: the selected modality lacks usable evidence or requires a higher-capacity interface than preregistered
    completion_record:
      date: 2026-10-17
      parameter_set_id: parameters.front_leg_feco_sensory_ensemble.v1
      evaluation_ref: calibration/evaluations/feco-native-bridge-factorization-v0.yaml
      outcome: >-
        Twenty-six of 36 scoped bodies have exact published type aliases. The ten
        remaining bodies are propagated as three type-shared variables, yielding
        27 routing profiles. Six boundary-valid activation shapes and eight joint
        source combinations are frozen. Native representation capacity is widened
        from one global binary choice to all eight class-shared claw/club/hook
        profiles, yielding 1,728 factorized members without a reference selection.
        Calcium cannot identify native amplitude, so that capacity is a separate
        named family handed to the already planned FH-05 coupled gate rather than
        a hidden default or an invented standalone prior.
      locally_frozen_family_ids:
        - parameter.proprioception.routing.v0
        - parameter.proprioception.transfer.v0
      conditional_open_family_id: parameter.proprioception.native_bridge.v0
      simulated_outcomes_inspected: false

  - id: FH-04
    title: Close the scoped motor slow-kernel and bodyId/class uncertainty
    nature: evidence_transfer_and_local_motor_gate
    status: complete
    depends_on: [FH-01, FH-02]
    estimated_batches: {min: 1, max: 2}
    exit_criteria:
      - slow-containing branches are independently represented, excluded with scope justification, or propagated as a bounded ensemble
      - no motor class is selected from body motion
      - event-to-force and force-to-direct-MOTOR stages remain separate
    replan_if: every admissible readout requires an unidentifiable slow branch
    completion_record:
      date: 2026-10-17
      parameter_set_id: parameters.front_leg_motor_transfer_ensemble.v1
      evaluation_ref: calibration/evaluations/front-leg-motor-transfer-propagation-v1.yaml
      outcome: >-
        The exact slow-cell archive supports a distinct causal tonic event-rate to
        force representation with modest held-out signal but a broad 338-member
        near-optimal envelope that touches tau and delay grid boundaries. All
        58,025 slow-containing body-class assignments are now executable through
        this finite diagnostic envelope; the 1,024 fast/intermediate-only
        assignments retain their separate twitch representations. All 59,049
        body-class assignments remain factorized, unranked and unselected. The
        force-to-direct-MOTOR surrogate remains a separate three-member axis.
      local_family_id: parameter.motor.transfer.v0
      retained_uncertainty: broad_boundary_contact_one_cell_diagnostic_envelopes_and_no_bodyid_class_crosswalk
      promoted_parameter_values: 0
      selected_body_class_assignments: 0
      simulated_body_outcomes_inspected: false

  - id: FH-05
    title: Bound typed central, basal and native-boundary identifiability on the cone
    nature: coupled_nonbehavioral_calibration
    status: complete
    depends_on: [FH-02]
    estimated_batches: {min: 1, max: 2}
    exit_criteria:
      - population alternatives are evidence-backed or explicitly propagated
      - the class-shared FeCO native bridge is crossed with the local efficacy and threshold ensemble without using the future response
      - source intensity, same-native efficacy, cross-native conversion and neuron dynamics remain separate owners
      - unknown-afferent sensitivity and compensation are reported
      - one finite admissible local ensemble exists without threshold-only selection
    replan_if: conclusions depend on unsampled assignment interactions or require a new central model capacity version
    completion_record:
      date: 2026-10-17
      parameter_set_id: parameters.front_leg_coupled_technical_ensemble.v0
      evaluation_ref: calibration/evaluations/front-leg-coupled-identifiability-execution-v0.yaml
      outcome: >-
        All 81 preregistered owner-separated members execute as paired FeCO
        stimulus/sham comparisons under both all-graded and all-event basal port
        mirrors, for 162 paired branches and 324 runtime instances. The bounded
        graph contains 6,041 explicit source ports, all 590 published direct
        source-to-cone edges and all 4,873 induced cone edges, while excluding
        outside recurrence. Every run is finite and all six owner axes alter an
        executed input. Main-effect signatures reveal no pair above the locked
        0.95 similarity warning, but unknown-afferent policy is weakly observable
        locally and no stimulus surplus of generated internal events occurs under
        these fixtures. All members remain unranked and unselected; zero value,
        population assignment, route or behavior is promoted.
      retained_uncertainty: >-
        81 owner-separated technical members times two source-native mirrors;
        unsampled higher-order population assignments and outside-cone recurrence
        remain outside the claim.
      simulated_body_outcomes_inspected: false

  - id: FH-06
    title: Compile and freeze an integrated runnable lineage
    nature: lineage_integration_and_causal_attribution
    status: planned
    depends_on: [FH-03, FH-04, FH-05]
    estimated_batches: {min: 1, max: 1}
    exit_criteria:
      - all member-conditioned dependencies and exposure labels are reconstructible
      - topology, actuator, mechanism and parameter hashes are frozen
      - full causal execution and replay agree on the scoped loop
    replan_if: a flexible interface can compensate for central or mechanical error without detection

  - id: FH-07
    title: Establish short-horizon neutral embodied technical stability
    nature: technical_embodied_calibration
    status: planned
    depends_on: [FH-06]
    estimated_batches: {min: 1, max: 2}
    exit_criteria:
      - every retained lineage is finite, bounded and recoverable under preregistered generic perturbations
      - no named action, stance sequence or held-out outcome enters selection
      - failures and any surviving ensemble remain explicit
    replan_if: no admissible member passes without jointly freeing central, sensory, motor and physical capacity

  - id: FH-08
    title: Lock the evaluation-only protocol and topology controls
    nature: prospective_protocol_lock
    status: planned
    depends_on: [FH-06, FH-07]
    estimated_batches: {min: 1, max: 1}
    exit_criteria:
      - stimulus, sham, mirrors, seeds, metrics, thresholds and analysis are sourced and immutable
      - frozen rewires and same-recipe recalibrated rewires are scheduled
      - mechanism coverage and contamination rules are attached
    replan_if: the candidate cannot yield an interpretable negative result with represented mechanisms

  - id: FH-09
    title: Execute and report the first held-out end-to-end evaluation
    nature: evaluation_only_execution
    status: planned
    depends_on: [FH-08]
    estimated_batches: {min: 1, max: 2}
    exit_criteria:
      - all scheduled normal, sham, mirrored and topology-control trials are accounted
      - the frozen protocol receives a positive, negative or ambiguous disposition
      - no inspected result feeds back into the same lineage or protocol version
    replan_if: execution reveals an unrepresented mechanism or invalid measurement contract

replanning_policy:
  statuses: [planned, ready, in_progress, complete, blocked, superseded]
  triggers:
    - the milestone definition changes
    - a new scientific gate adds at least one expected batch
    - an accepted prerequisite is invalidated
    - the selected modality or dependency path changes
    - the forecast minimum or maximum increases
  required_record:
    - increment revision and preserve the prior estimate in history
    - name the discovery or mistake rather than silently replacing the number
    - record old and new item counts and batch ranges
    - identify reusable, invalidated, added and removed work
    - update calibration/state.yaml and PROJECT_STATE.md in the same delivery
  batch_report_accounting: after_equals_before_minus_closed_plus_newly_discovered
  proportionality: >-
    This roadmap is a lightweight planning aid. Small reversible work may proceed
    without creating sub-items; discoveries with scientific or schedule impact
    must not be hidden inside an unchanged forecast.

