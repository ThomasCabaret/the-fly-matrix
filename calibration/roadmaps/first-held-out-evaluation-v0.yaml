      evaluation_ref: calibration/evaluations/front-leg-motor-transfer-propagation-v1.yaml
      outcome: >-
        The exact slow-cell archive supports a distinct causal tonic event-rate to
        force representation with modest held-out signal but a broad 338-member
        near-optimal envelope that touches tau and delay grid boundaries. All
        58,025 slow-containing body-class assignments are now executable through
