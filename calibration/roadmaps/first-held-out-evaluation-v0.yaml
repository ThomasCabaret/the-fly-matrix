replanning_policy:
  statuses: [planned, ready, in_progress, complete, blocked, superseded]
  triggers:
    - the milestone definition changes
    - a new scientific gate adds at least one expected batch
    - an accepted prerequisite is invalidated
    - the selected modality or dependency path changes
    - the forecast minimum or maximum increases
  required_record:
    - increment revision and preserve the prior estimate in history
    - name the discovery or mistake rather than silently replacing the number
    - record old and new item counts and batch ranges
    - identify reusable, invalidated, added and removed work
    - update calibration/state.yaml and PROJECT_STATE.md in the same delivery
  batch_report_accounting: after_equals_before_minus_closed_plus_newly_discovered
  proportionality: >-
    This roadmap is a lightweight planning aid. Small reversible work may proceed
    without creating sub-items; discoveries with scientific or schedule impact
    must not be hidden inside an unchanged forecast.

