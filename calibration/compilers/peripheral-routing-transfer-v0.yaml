id: compiler.peripheral_routing_transfer.v0
status: implemented_structure_validated_values_unfitted
claim_label: COMPILER INFRASTRUCTURE / SYNTHETIC STRUCTURE TEST / NOT CALIBRATION
contract:
  equation: runtime_coefficient[edge] = routing_weight[logical_route(edge)] * transfer_value[transfer_assignment(edge)]
  routing_constraints: [finite, non_negative, exact_key_set, unit_simplex_per_route_group]
  transfer_constraints: [finite, explicit_assignment_for_every_runtime_edge, exact_used_key_set]
  invariants:
    - Candidate sources are hash-locked and cannot be widened by compilation.
    - Runtime parameter order is deterministic and matches each box manifest.
    - Transfer sharing is supplied explicitly; the compiler never chooses it.
    - A logical route may expand to multiple runtime edges without becoming multiple routing decisions.
    - Offsets and temporal dynamics remain separate future parameters and are not hidden in this scalar compiler.
