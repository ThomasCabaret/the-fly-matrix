risks:
  - id: risk.central_rate_representation_fidelity.v0
    title: Continuous rate state may erase behaviorally necessary spike timing and delays
    status: open_critical_stop_gate
    affected_model_id: model.malecns_typed_signed_rate.v0
    affected_parameter_family_ids:
      - parameter.central.synaptic_efficacy.v0
      - parameter.central.neuron_dynamics.v0
      - parameter.baseline.olfaction.v0
      - parameter.baseline.gustation.v0
      - parameter.baseline.thermohygro.v0
    hypothesis_under_test: >-
      A globally shared bounded continuous rate state with instantaneous
      step-to-step propagation preserves enough MaleCNS computation for the
      intended embodied claims.
    evidence_supporting:
      - The representation executes the complete canonical graph efficiently on the available GPU.
      - It is useful as a deterministic engineering comparator and exposes numerical pathologies.
      - Non-spiking graded models have succeeded in the biologically non-spiking early fly visual system, but that evidence is scope-specific.
      - The bounded fixed-delay LIF reference now passes an independent deterministic recurrent small-graph comparison and exhaustive full-graph event accounting.
      - The complete outgoing event graph and LIF state fit comfortably in available CPU and GPU memory.
      - An independent antennal circuit candidate maps exactly to MaleCNS aBN1/aDN1/aDN2 and preserves nonzero JON-to-aBN and aBN-to-aDN structural paths.
    evidence_against_or_unresolved:
      - The candidate emits no spikes and has no refractory state, synaptic event kernel, or transmission delay.
      - No source or held-out circuit result validates this abstraction across MaleCNS.
      - Shiu et al. obtained experimentally tested whole-brain circuit predictions with an event-based leaky integrate-and-fire model.
      - The current normalized input destroys absolute spikes-per-second units and couples every modality through instantaneous whole-vector normalization.
      - The biological importance of path-dependent conduction timing has not been tested and cannot be assumed negligible.
      - The first generic 0.1 ms event implementation reaches only about 0.03 to 0.05 times real time and has not yet been compared on an independent circuit reference.
      - The circuit mapping is not yet complete: FlyWire aBN2 type CB3129 has no resolved MaleCNS counterpart, and the two retained aBN2 types collapse to one four-cell candidate set.
    consequence_if_true: >-
      The rate runtime may remain a scientifically useful low-cost model for the
      scopes that pass the comparison gate.
    consequence_if_false: >-
      Promote an event-based or hybrid central model version; retain the rate
      runtime only for engineering comparison and rebase all model-dependent
      calibration on the chosen native units.
    current_mitigation: >-
      Pause the basal unit bridge and propagation of the 31 rate candidates. The
      small-graph, edge-accounting and CPU/GPU feasibility stages have passed;
      resolve the partial aBN2 transfer, then lock and run the shared probes and
      circuit reference before further dependent fitting.
    cheapest_discriminating_experiment: >-
      Implement a source-traceable LIF event baseline, validate it against a
      deterministic small-graph reference, benchmark full MaleCNS, then compare
      event and rate candidates on fixed technical probes and one circuit-level
      reference not used for parameter choice.
    work_at_risk:
      scientific_blast_radius: all central dynamics, basal input units, local interface campaigns, embodied calibration, and behavior claims
      reusable_if_rejected: wiring, signed edge inventory, sparse graph loaders, runner, physical loop, replay, evidence inventories, and rate benchmark
      budget_policy: one_bounded_implementation_and_comparison_lot_before_resuming_dependent_calibration
    escalation_triggers:
      - event baseline is computationally infeasible on the full graph
      - rate and event candidates disagree materially on preregistered circuit probes
      - available data cannot define a defensible event or delay policy
    forbidden_shortcuts:
      - treating GPU throughput as biological validation
      - continuing model-dependent basal fitting merely because the rate bridge is easy to implement
      - claiming delay or spike timing is negligible without a sensitivity result
      - selecting a model because its embodied motion looks preferable
    decision_ref: decisions/0014-neural-dynamics-fidelity-gate.md
    next_review: after_neural_model_class_gate_v0

  - id: risk.central_delay_fidelity.v0
    title: Uniform or zero transmission delay may miss morphology-dependent timing
    status: open_high_impact
    affected_model_id: model.malecns_typed_signed_rate.v0
    affected_parameter_family_ids:
      - parameter.central.neuron_dynamics.v0
    hypothesis_under_test: >-
      A fixed transmission delay is sufficient for the first event-based MaleCNS
      baseline, and path-dependent delays do not materially change the selected
      preregistered metrics at that stage.
    evidence_supporting:
      - Shiu et al. used a fixed 1.8 ms delay in a successful whole-brain circuit-prediction model.
      - The implemented baseline resolves 1.8 ms exactly at a declared 0.1 ms numerical step.
    evidence_against_or_unresolved:
      - The current rate candidate uses no transmission delay.
      - The flat MaleCNS weight table does not itself provide accepted edge-specific conduction delays.
      - Geometry, conduction velocity, synapse location and compartmental integration may affect relative arrival time.
    consequence_if_true: A fixed-delay LIF baseline can precede morphology-aware refinement.
    consequence_if_false: Add a versioned morphology-derived delay family and revalidate temporal descendants.
    current_mitigation: >-
      Make delay policy explicit in the event baseline and retain morphology-aware
      delay extraction as a separate, testable model version rather than assuming
      either zero delay or exact cable timing. Do not download the full morphology
      bundle until a bounded temporal sensitivity probe justifies the path-length work.
    escalation_triggers:
      - path-length data and conduction evidence become available
      - temporal probes are sensitive to plausible delay variation
      - a fixed delay cannot reproduce a held-out circuit timing reference
    forbidden_shortcuts:
      - inferring delays from Euclidean soma distance without validation
      - calling absent delay data evidence for zero delay
    decision_ref: decisions/0014-neural-dynamics-fidelity-gate.md
    next_review: during_neural_model_class_gate_v0

  - id: risk.central_twelve_parameter_capacity.v0
    title: Twelve shared central parameters may underfit biological heterogeneity
    status: open_high_impact
    affected_model_id: model.malecns_typed_signed_rate.v0
    affected_parameter_family_ids:
      - parameter.central.synaptic_efficacy.v0
      - parameter.central.neuron_dynamics.v0
    hypothesis_under_test: >-
      Nine transmitter-class efficacies plus one global time constant, input gain
      and bias may be sufficient for the first technically and locally coherent
      embodied model.
    evidence_supporting:
      - The representation executes every canonical edge without per-edge residuals.
      - Thirty-one sampled members pass broad stability and timestep-refinement gates.
    evidence_against_or_unresolved:
      - Transmitter class alone does not establish identical synaptic efficacy.
      - Global neuron dynamics ignore cell-class, regional and receptor-dependent heterogeneity.
      - The surviving ensemble has high raw-motor pattern and amplitude dispersion.
      - No local interface or embodied result currently validates this sharing level.
    consequence_if_true: A compact shared central model can remain the first embodied baseline.
    consequence_if_false: Create a versioned higher-capacity central model and revalidate affected descendants.
    current_mitigation: >-
      Stop repeated central-only narrowing after cheap pathology and numerical
      gates. Propagate all 31 survivors through local or hybrid campaigns and use
      preregistered residuals to decide whether capacity must increase.
    escalation_triggers:
      - systematic residuals by neuron class or anatomical region
      - mutually incompatible local interface parameters across central members
      - no ensemble member satisfies independent local and neutral embodied constraints
    forbidden_shortcuts:
      - selecting a member by visually pleasing motion
      - adding per-neuron or per-edge parameters without a versioned residual diagnosis
      - claiming that technical stability validates biological dimensionality
    decision_ref: decisions/0013-ensemble-propagation-and-model-adequacy.md
    next_review: after_first_ensemble_aware_local_or_hybrid_campaign

  - id: risk.central_event_model_fidelity.v0
    title: Homogeneous point-neuron LIF may misrepresent graded or compartment-sensitive populations
    status: open_critical_scope_gate
    affected_model_id: model.malecns_lif_fixed_delay.v0
    affected_parameter_family_ids:
      - parameter.central.synaptic_efficacy.v0
      - parameter.central.neuron_dynamics.v0
    hypothesis_under_test: >-
      One fixed-delay point-neuron LIF abstraction is adequate across every
      canonical MaleCNS population needed by the first embodied claim.
    evidence_supporting:
      - A source-traceable whole-brain LIF precedent produced experimentally tested circuit predictions.
      - The local implementation passes an independent deterministic recurrent-graph reference and full-graph event accounting.
    evidence_against_or_unresolved:
      - Some fly circuits use graded or non-spiking dynamics, and one local circuit cannot validate a homogeneous whole-CNS class.
      - Morphology and synapse location are absent from the point-neuron representation.
      - No shared rate-versus-event circuit comparison has yet produced a scoped go, revise or stop decision.
    consequence_if_true: The LIF lineage may proceed for the populations and claims that pass the gate.
    consequence_if_false: Use a population-typed, hybrid or compartment-aware model and revalidate model-dependent descendants.
    current_mitigation: >-
      Treat LIF as a comparator, report residuals by class and region, and permit a
      typed/hybrid conclusion. Escalate morphology only after cheaper sign, delay,
      input-unit and interface explanations fail on multiple independent circuits.
    cheapest_discriminating_experiment: >-
      Run the preregistered circuit and technical probes across rate, LIF and any
      independently justified graded population; limit acceptance to tested scopes.
    work_at_risk:
      scientific_blast_radius: central dynamics and all model-dependent interface units
      reusable_if_rejected: event engine, sparse graph, runner, circuit mapping, evidence inventory, physical loop and replay
      budget_policy: one_scoped_comparison_before_homogeneous_global_promotion
    escalation_triggers:
      - systematic class-localized residuals across independent circuits
      - failure persists after sign, delay and interface uncertainty are bounded
      - morphology-sensitive reference data become available
    forbidden_shortcuts:
      - promoting homogeneous LIF because one circuit passes
      - treating every annotated neuron as obligatorily spiking
      - adding compartments without a discriminating residual
    decision_ref: decisions/0014-neural-dynamics-fidelity-gate.md
    next_review: during_neural_model_class_gate_v0

  - id: risk.flybody_actuator_abstraction.v0
    title: Direct FlyBody joint actuation may supply or hide part of motor control
    status: open_critical_pre_embodied_claim_gate
    affected_model_id: body.flybody
    affected_parameter_family_ids:
      - parameter.body.flybody_mechanics.v0
      - parameter.motor.transfer.v0
      - parameter.technical.motor_command_envelope.v0
    hypothesis_under_test: >-
      The current direct MuJoCo motor-actuator surrogate is sufficiently bounded
      and understood that a stimulus-specific response can be attributed to
      MaleCNS plus declared local transfer rather than hidden actuator control.
    evidence_supporting:
      - Current code explicitly instantiates ActuatorType.MOTOR on all 102 channels rather than position or velocity servos.
      - Exact addressing, deterministic replay and passive-control difference pass integration tests.
    evidence_against_or_unresolved:
      - Direct joint motor commands omit explicit muscle activation, compliance and local reflex dynamics.
      - Command-to-force/state behavior by actuator class and load has not been characterized.
      - The external FlyBody mechanical constants remain borrowed surrogate values.
    consequence_if_true: Direct motor actuation may support the first bounded embodied claim with an explicit applicability limit.
    consequence_if_false: Introduce a versioned muscle/activation or lower-level actuation model before behavioral interpretation.
    current_mitigation: Freeze actuator semantics and block neutral embodied fitting and held-out interpretation on a bounded behavior-naive actuator audit.
    cheapest_discriminating_experiment: Run class-stratified passive, impulse, step, load and open-loop replay probes with no named action target.
    work_at_risk:
      scientific_blast_radius: motor transfer, neutral embodied stability and every movement-based claim
      reusable_if_rejected: exact addressing, motor topology, physical replay and probe harness
      budget_policy: one_bounded_actuator_semantics_lot_before_global_embodied_fitting
    escalation_triggers:
      - substantial stabilization arises from actuator or mechanical defaults
      - response is highly sensitive to undocumented low-level parameters
      - direct motor and muscle-aware surrogates yield incompatible local responses
    forbidden_shortcuts:
      - calling direct motor actuation biological muscle physiology
      - introducing a position or velocity servo through a default
      - selecting actuator semantics using a named behavior
    decision_ref: decisions/0015-embodied-causal-attribution-gates.md
    next_review: target_actuator_semantics_gate_v0

  - id: risk.peripheral_interface_compensation.v0
    title: Flexible peripheral interfaces may compensate for central or mechanical error
    status: open_high_impact
    affected_model_id: calibration.parameter_dependency_dag.v0
    affected_parameter_family_ids:
      - parameter.vision.transfer.v0
      - parameter.proprioception.transfer.v0
      - parameter.mechanosensation.transfer.v0
      - parameter.motor.transfer.v0
    hypothesis_under_test: >-
      Local evidence and sharing constraints identify peripheral transfers well
      enough that they cannot become implicit whole-body controllers.
    evidence_supporting:
      - Candidate envelopes are independently validated, local and finite.
      - Routing and transfer families are compiled separately with explicit sharing.
    evidence_against_or_unresolved:
      - Transfer-sharing levels and local datasets remain unresolved.
      - A global stability loss could admit compensating central, sensory, motor and physical parameter blocks.
    consequence_if_true: Locally frozen interfaces can support interpretable central and embodied calibration.
    consequence_if_false: Retain an ensemble or redesign local measurements; do not resolve ambiguity with more global capacity.
    current_mitigation: Require local freeze, family-wise residuals, hold-one-block-fixed ablations and explicit joint-identifiability arguments.
    cheapest_discriminating_experiment: Fit one minimal sensory and motor chain under alternative frozen central members and measure parameter incompatibility and residual structure.
    escalation_triggers:
      - multiple interface/central combinations yield indistinguishable local observations
      - a transfer layer learns coordinated whole-body action
      - global fitting materially changes locally accepted families
    forbidden_shortcuts:
      - freeing all layers in the first neutral stability campaign
      - hiding tonic output or behavior policy in a gain
      - selecting compensation by trajectory appearance
    decision_ref: decisions/0015-embodied-causal-attribution-gates.md
    next_review: before_first_joint_or_embodied_campaign

  - id: risk.unknown_afferent_sensitivity.v0
    title: Unresolved afferent basal policy may dominate central dynamics
    status: open_bounded_sensitivity_required
    affected_model_id: model.malecns_lif_fixed_delay.v0
    affected_parameter_family_ids:
      - parameter.residual_sensory.unknown_nominal.v0
      - parameter.residual_sensory.mechanosensory_tbc_nominal.v0
      - parameter.residual_sensory.chemosensory_nominal.v0
    hypothesis_under_test: >-
      Central and local conclusions are robust over a small plausible range of
      poor, behavior-naive policies for unresolved afferents.
    evidence_supporting:
      - Every residual source remains explicit, counted and parameterized rather than dropped.
    evidence_against_or_unresolved:
      - 1815 channels retain unknown modality and no accepted biological values.
      - Their effect under zero, low tonic and stochastic hypotheses has not been measured.
    consequence_if_true: Propagate the tested basal uncertainty without blocking unrelated local work.
    consequence_if_false: Promote annotation or measurement of these afferents to a priority gate.
    current_mitigation: Pre-register a small hypothesis grid and report sensitivity without using behavior to choose a member.
    cheapest_discriminating_experiment: Compare technical central and local metrics under zero, bounded tonic and matched stochastic source families.
    escalation_triggers:
      - material changes in selected model class or local transfer residuals
      - instability occurs only under one arbitrary residual policy
    forbidden_shortcuts:
      - choosing the basal policy that improves a named behavior
      - relabelling unknown sources as measured physiology
    decision_ref: decisions/0015-embodied-causal-attribution-gates.md
    next_review: after_central_model_class_units_are_selected

  - id: risk.missing_mechanism_coverage.v0
    title: Absent electrical, muscular or compartmental mechanisms can confound behavior failures
    status: open_applicability_risk
    affected_model_id: model.malecns_lif_fixed_delay.v0
    affected_parameter_family_ids:
      - parameter.central.neuron_dynamics.v0
      - parameter.body.flybody_mechanics.v0
      - parameter.motor.transfer.v0
    hypothesis_under_test: >-
      The first selected held-out behavior does not materially require a causal
      mechanism absent from the represented chemical connectome and body model.
    evidence_supporting:
      - The catalog can prioritize short local tactile responses with fewer simultaneous dependencies.
    evidence_against_or_unresolved:
      - Accepted electrical-coupling edges are not currently part of the runtime graph.
      - Detailed muscles, flight control and compartmental integration are not represented.
      - Looming/takeoff and other candidate circuits may depend on such mechanisms.
    consequence_if_true: A negative result is more interpretable as a model/calibration test.
    consequence_if_false: Add the missing mechanism or label the behavior result mechanistically ambiguous.
    current_mitigation: Require a mechanism-coverage statement before protocol lock and defer high-confound evaluations.
    cheapest_discriminating_experiment: Literature-backed circuit mechanism inventory for the one candidate being considered, not the whole brain.
    escalation_triggers:
      - the candidate circuit has known essential electrical coupling
      - the readout requires unrepresented flight or muscle dynamics
    forbidden_shortcuts:
      - treating an absent mechanism as a failed calibration
      - adding an unsourced surrogate only to rescue the evaluated behavior
    decision_ref: decisions/0015-embodied-causal-attribution-gates.md
    next_review: before_locking_each_evaluation_only_protocol

next_action: Resolve the ADR 0014 neural model-class gate and preregister the ADR 0015 actuator audit before model-dependent basal, broad joint or neutral embodied campaigns.
