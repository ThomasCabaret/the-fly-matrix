accepted_claims:
- The frozen 196-neuron induced graph supports explicit accounting of all four native-boundary
  kinds over the retained assignment profiles.
- Every routing/native pair and every intermediate/native pair is scheduled at least
  once without claiming full three-way coverage.
- A 27-run owner design crosses every pair among six separate parameter owners in
  all nine level combinations.
- Three structural anchors and all 27 owner rows define 81 preregistered dynamic sentinels
  for the next FH-05 delivery.
- Existing unknown-afferent ablation sensitivity is carried as a warning and a design
  axis, not as a biological conclusion.
forbidden_claims:
- Any engineering coordinate is a physiological value, prior, bound or preferred member.
- Pairwise coverage represents all higher-order interactions or the 2^184 scientific
  assignment space.
- A structural anchor is a native population census or a selected routing profile.
- Threshold crossing, bounded activity or future body motion may select an owner coordinate.
- This static design establishes the finite admissible FH-05 local ensemble.
next_action: Execute the 81 preregistered dynamic sentinels with one explicit unpromotable
  fixture, quantify factor compensation and local observability, then derive or explicitly
  retain a finite owner-separated admissible ensemble. Escalate only if unsampled
  higher-order assignment interactions change the conclusion.
