accepted_claims:
- The fixed sentinel tuples execute every declared local stage from FeCO source functions
  through paired MuJoCo physics.
- Event and graded intermediate candidates coexist in one event-capable typed execution
  path with explicit conversion and delay boundaries.
- The local graph, schedule, population inventories and physical adapter remain hash-frozen
  and no unscoped actuator receives a command.
forbidden_claims:
- Any probe constant, unknown sign, functional projection, native representation,
  population assignment, motor class, route or gain is calibrated or selected.
- The diagnostic round-robin FeCO endpoint projection is a biological claw/club/hook
  map.
- A passing execution sentinel establishes neural stability, embodied stability or
  behavior.
- The bounded two-hop corridor is a complete model of the full MaleCNS recurrent dynamics.
next_action: If all four tuples pass, run the immutable 120-tuple local panel with
  the same execution contract and retain every failure. Analyze robustness only over
  the scheduled tuples; do not rank candidates from body motion and do not promote
  these diagnostic neural constants.
