accepted_claims:
- The 2^148 intermediate assignment space can be probed with a deterministic 50-profile
  pairwise covering panel without treating that panel as the full scientific ensemble.
- Every unresolved intermediate is exercised equally in event and graded candidate
  modes, and every pair sees all four state combinations.
- The 24 FeCO alternatives are locally accepted as an unselected uncertainty set suitable
  for factorized propagation.
- The motor uncertainty set is explicitly partitioned into 1024 fast/intermediate
  assignments with diagnostic kernels and 58025 slow-containing assignments blocked
  by missing temporal evidence.
- Route bases and bridge gains may enter declared nonbehavioral sensitivity schedules
  without becoming biological reference values.
forbidden_claims:
- Pairwise panel coverage validates all higher-order interactions or reduces 2^148
  scientific possibilities to 50.
- A hash profile is a biological prior, parameter set or preferred native assignment.
- FeCO residual ranking identifies event versus graded native dynamics.
- Slow motor dynamics may be copied from fast or intermediate cells.
- Body motion, stability or a named behavior may select any profile, path, class,
  route or gain.
next_action: Freeze the complete measurement contract for a minimal neutral embodied
  technical campaign, then schedule a bounded factorized subset explicitly. Keep all
  58025 slow-containing motor assignments visible as blocked and report robustness
  only over the tuples actually executed.
