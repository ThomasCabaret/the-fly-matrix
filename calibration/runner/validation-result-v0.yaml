accepted_claims:
  - The runner validates immutable input hashes and topology boundaries before execution.
  - Every scheduled trial is retained as accepted, rejected, error, or budget-skipped.
  - Repetitions are compared by semantic metric hash and reproduce exactly for the validation evaluator.
  - Fitting and validation modes reject held-out scenario identifiers.
  - Evaluators must be explicitly registered in code; a job cannot execute an arbitrary shell command.
  - Evaluator policy prevents the infrastructure validator from being reused as a fitting campaign.
