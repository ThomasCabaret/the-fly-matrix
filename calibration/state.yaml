blocked_by:
  - The current central runtime is a continuous rate comparator with no spike events, refractory state, synaptic event kernel, or transmission delay; no evidence validates that abstraction across MaleCNS.
  - Model-dependent calibration is paused until the bounded ADR 0014 rate-versus-event gate produces an explicit go, revise, or stop decision.
  - The twelve-parameter central model is a minimum-capacity hypothesis, not a validated biological dimensionality; further isolated narrowing is paused unless independent central evidence becomes available.
  - Routing values, transfer-sharing assignments, local datasets and bounds remain unselected for proprioception, mechanosensation and motor output; the compiler now preserves their separation but does not infer them.
  - The preregistered motor-terminal sensitivity study is high for pattern and amplitude, so the 31 surviving central candidates cannot be treated as interchangeable downstream.
  - Numerical portability does not distinguish the 31 rate survivors biologically; they remain an engineering ensemble and may only be propagated scientifically if their model class passes the ADR 0014 gate.
  - Published basal measurements use spikes per second while the current embodied input uses whole-vector normalized model activity; the correct bridge depends on the unresolved central model class and must not be invented first.
  - The antennal circuit reference maps exactly for aBN1, aDN1 and aDN2 and has nonzero MaleCNS structural paths, but one of three pinned aBN2 FlyWire types (CB3129) has no resolved MaleCNS match; the scientific protocol remains unlocked.
  - Basal evidence supports 128 known-modality annotation partitions but not a complete value table; all 1883 residual source channels remain explicitly unresolved or surrogate-only.

