blocked_by:
  - The global homogeneous rate-versus-LIF choice is closed as revise; no canonical population yet has a promoted dynamics assignment under the typed/hybrid contract.
  - Model-dependent calibration may proceed only on bounded populations with evidence-backed or explicitly dual-unresolved assignments and named unit-conversion boundaries.
  - The twelve-parameter central model is a minimum-capacity hypothesis, not a validated biological dimensionality; further isolated narrowing is paused unless independent central evidence becomes available.
  - Routing values, transfer-sharing assignments, local datasets and bounds remain unselected for proprioception, mechanosensation and motor output; the compiler now preserves their separation but does not infer them.
  - The preregistered motor-terminal sensitivity study is high for pattern and amplitude, so the 31 surviving central candidates cannot be treated as interchangeable downstream.
  - Numerical portability does not distinguish the 31 rate survivors biologically; they remain an engineering ensemble and may be propagated only inside an explicit graded population assignment or unresolved local comparison.
  - Published basal measurements use spikes per second while the current embodied input uses whole-vector normalized model activity; bridges must now target a declared event, graded, or typed conversion contract rather than one global model unit.
  - The full antennal-grooming circuit maps exactly for aBN1, aDN1 and aDN2 but one of three pinned aBN2 FlyWire types (CB3129) has no resolved MaleCNS match; complete-circuit use remains blocked.
  - The narrow aBN1 JO-CE versus JO-F model-class protocol is locked and explicitly excludes aBN2; CB3129 remains unresolved for any complete grooming-circuit claim.
  - The aBN1 v2 pilot ran on the complete graph with shared schedule semantics: event LIF and all nine tested rate member/bridge series had JO-CE above JO-F at 20, 120 and 220 Hz. It supports neither homogeneous global class and remains exposed evidence for descendants.
  - The unbatched full aBN1 protocol would cost about 8.5 GPU-hours event plus 7.8 GPU-hours rate across 64,860 units; it is not run for the global decision because the expected discriminating value is insufficient.
  - The corrected LIF v1 matches Brian2 2.5.1 on the preregistered scheduler boundaries, but this engineering conformance does not validate the point-neuron class or constants biologically.
  - At 5 ms bins the rate comparator provably aliases the tested phase, inter-channel order and sub-bin delay distinctions; whether those distinctions matter for each MaleCNS population remains open until locked biological comparisons.
  - Basal evidence supports 128 known-modality annotation partitions but not a complete value table; all 1883 residual source channels remain explicitly unresolved or surrogate-only.
  - The direct-motor actuator gate is closed only as a bounded short-horizon surrogate: unloaded homolog responses are symmetric and passive/open/closed effects are separated, but muscle, tendon, compliance and local-reflex fidelity remain outside the accepted model.
  - The uncalibrated live MaleCNS feedback changes motor commands after both generic perturbations but changes the final physical deviation by only about two parts per million relative to frozen open-loop commands; it is not currently evidence of stabilization or biological feedback control.
  - Flexible peripheral transfers could compensate for central or mechanical error; local evidence, sharing limits and family-wise ablations are required before any broad joint campaign.
  - Electrical coupling, detailed muscle dynamics and compartmental integration are not represented as accepted mechanisms, so candidate evaluations depending on them require an explicit applicability warning.

