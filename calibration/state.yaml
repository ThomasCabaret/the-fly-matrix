blocked_by:
  - The twelve-parameter central model is a minimum-capacity hypothesis, not a validated biological dimensionality; further isolated narrowing is paused unless independent central evidence becomes available.
  - Routing values, transfer-sharing assignments, local datasets and bounds remain unselected for proprioception, mechanosensation and motor output; the compiler now preserves their separation but does not infer them.
  - The preregistered motor-terminal sensitivity study is high for pattern and amplitude, so the 31 surviving central candidates cannot be treated as interchangeable downstream.
  - Numerical portability does not distinguish the 31 survivors biologically; the finite ensemble must be propagated into local or hybrid campaigns rather than collapsed arbitrarily.
  - Published basal measurements use spikes per second while the current embodied input uses whole-vector normalized model activity; a versioned unit bridge is required before numerical evidence transfer.
  - Basal evidence supports 128 known-modality annotation partitions but not a complete value table; all 1883 residual source channels remain explicitly unresolved or surrogate-only.

next_action: >-
  Define and validate the explicit biological-rate to model-activity bridge, then
  build bounded class-level basal candidate ensembles and run them across all 31
  central members. Report shared versus member-conditioned admissibility and
  model-capacity residuals; do not promote an arbitrary central member or an
  unsupported residual-channel value.
