population:
  rule_id: malecns-v1.0-population-scope-v1
  expected_canonical_neurons: 166700
  expected_transmitter_rows_in_scope: 166522
  expected_missing_records: 178
  expected_runtime_edges: 25582938
  expected_runtime_synapse_weight: 124177617
  expected_label_counts:
    acetylcholine: 103720
    dopamine: 392
    gaba: 22069
    glutamate: 29302
    histamine: 7891
    missing: 178
    octopamine: 101
    serotonin: 48
    unclear: 2999
  expected_evidence_origin_counts:
    cell_type_prediction: 4892
    missing_record: 178
    neuron_and_cell_type_prediction: 67181
    neuron_prediction: 1546
    source_consensus_other_rule: 4420
    source_curated_ground_truth: 85484
    unresolved_source_consensus: 2999
  expected_sign_interpretation_counts:
    context_dependent: 37734
    excitatory_prior: 103720
    inhibitory_prior: 22069
    unresolved: 3177
  expected_edge_counts_by_prior:
    inhibitory_prior: 4925557
    unknown_or_context_dependent: 5912244
    excitatory_prior: 14745137
  expected_synapse_weight_by_prior:
    inhibitory_prior: 25717652
    unknown_or_context_dependent: 24968801
    excitatory_prior: 73491164

label_resolution:
  preserve_raw_columns: true
  source_ground_truth_precedence: true
  otherwise_use_source_consensus: true
  unclear_label: unclear
  missing_label: missing
  confidence_policy:
    source_ground_truth: unquantified_preserve_as_null
    agreeing_neuron_and_cell_type_predictions: minimum_reported_confidence
    single_matching_prediction: matching_reported_confidence
    unresolved: null
  unmatched_consensus_policy: preserve_source_consensus_and_report_separately

typed_sign_prior:
  mappings:
    acetylcholine: {code: 1, interpretation: excitatory_prior}
    gaba: {code: -1, interpretation: inhibitory_prior}
    glutamate: {code: 0, interpretation: context_dependent}
    histamine: {code: 0, interpretation: context_dependent}
    dopamine: {code: 0, interpretation: context_dependent}
    serotonin: {code: 0, interpretation: context_dependent}
    octopamine: {code: 0, interpretation: context_dependent}
    unclear: {code: 0, interpretation: unresolved}
    missing: {code: 0, interpretation: unresolved}
  zero_code_semantics: no_sign_assertion_not_zero_synaptic_effect

accepted_claims:
  - The recipe reproduces source-provided transmitter labels for canonical neurons.
  - Cholinergic and GABAergic labels create typed sign priors, not fixed effects.
  - Every other transmitter and every absent or unclear label remains sign-unknown.
  - Runtime-edge coverage is inherited from the presynaptic neuron and exhaustively counted.

forbidden_claims:
  - Ground-truth labels are independently revalidated by this compiler.
  - Every synapse has a known physiological sign or conductance.
  - A zero sign code means zero biological effect.
  - The unsigned benchmark profile becomes a calibrated dynamics model.

known_limitations:
  - The flat MaleCNS file does not expose a numeric confidence for source ground-truth labels.
  - Postsynaptic receptor identity is absent, so several transmitter classes remain context-dependent.
  - The upstream community ground-truth table has an open curation warning; the exact local dataset hash is therefore retained.

references:
  - https://doi.org/10.1101/2025.10.09.680999
  - https://github.com/flyconnectome/drosophila_neurotransmitters
  - https://github.com/flyconnectome/drosophila_neurotransmitters/issues/6

outputs:
  root: data/derived/calibration/transmitter-sign-prior-v0
  neuron_table: neuron-priors.parquet
  runtime_arrays: runtime-prior.npz
  summary: summary.json

next_action: Re-run this deterministic compiler after any source or population-rule change.
