feco_calcium_subset:
  source_dataset:
    doi: https://doi.org/10.5061/dryad.gqnk98t16
    dryad_version_id: 393607
    license: CC0-1.0
    relationship_to_primary_experiment: >-
      Processed/adapted Mamiya 2018 FeCO calcium data republished with the 2025
      presynaptic-inhibition study. This is not the raw 2018 imaging archive.
  acquisition_policy: required_small_complete_for_named_classes
  total_expected_bytes: 2025899
  files:
    - dataset_id: feco-mamiya2018-claw-calcium-adapted-2025
      functional_class: claw_position
    - dataset_id: feco-mamiya2018-club-calcium-adapted-2025
      functional_class: club_vibration_and_speed
    - dataset_id: feco-mamiya2018-hook-flexion-calcium-adapted-2025
      functional_class: hook_flexion_direction
    - dataset_id: feco-mamiya2018-adapted-2025-readme
      functional_class: documentation
    - dataset_id: feco-dallmann2025-predict-gcamp-source
      functional_class: observation_model_source
    - dataset_id: feco-dallmann2025-fit-activation-source
      functional_class: fitting_recipe_source
    - dataset_id: feco-dallmann2025-polynomial-source
      functional_class: observation_model_source
  admissible_uses:
    - reproduce the published processed table schemas and local sample accounting
    - fit or compare kinematics-to-calcium observation candidates with local held-out splits
    - constrain class-level response shape in the units explicitly present in the files
  forbidden_inferences:
    - calcium traces directly identify spikes or membrane voltage
    - the processed tables identify the native graded-versus-event representation
    - recorded cells are individually crosswalked to the 36 selected MaleCNS bodies
    - normalized calcium amplitude is a CNS runtime unit without a separate bridge
  acquisition_constraint:
    dryad_file_bytes: requires_DRYAD_BEARER_TOKEN_as_of_2026_10_07
    public_github_sources: anonymous_download_available
    credential_policy: bearer_removed_before_cross_host_presigned_storage_redirect

