ported_semantics:
  matlab_indices_are_one_based: true
  excluded_trials_are_removed: true
  camera_time: falling_exposure_edges_with_single_missing_edge_repair
  fast_intermediate:
    alignment: first_neural_spike_or_stimulus_end_for_zero_spike_trials
    peak_window_s: [0.0, 0.3]
    zero_spike_mean_window_s: [0.0, 0.07]
    fast_small_peak_rejection_source_pixels: 10
    aggregation: mean_and_sample_sem_by_probe_position_and_spike_count
  slow:
    grouping: injected_current_step
    probe_baseline_window_s: [-0.2, 0.0]
    peak_window: stimulus_half_open_0_to_stimulus_duration
    firing_rate_window_s: 0.03333333333333333
    positive_step_rate: mean_upper_half_of_smoothed_stimulus_rate
    negative_step_rate: mean_stimulus_rate
    smoothing: MATLAB_smooth_moving_for_finite_vectors_LOWESS_when_NaNs_are_present
  normalized_contract_note: >-
    The legacy normalized column step_index carries the source injected-current
    Step value, not an ordinal row index. It is retained for compatibility with
    the preregistered fit and documented here to prevent semantic confusion.

