sources:
  - id: shiu_et_al_2024
    citation: Shiu PK et al. (2024), A Drosophila computational brain model reveals sensorimotor processing
    doi: 10.1038/s41586-024-07763-9
    used_claims:
      - The antennal circuit was evaluated independently of the sugar-to-MN9 unit-weight fit.
      - JO-CE robustly activated aBN1 experimentally whereas JO-F did not, despite direct structural input from both classes.
      - The circuit includes JON inputs, aBN1/aBN2 interneurons and aDN1/aDN2 descending neurons.
    applicability_limits:
      - The source connectome is female FlyWire, whereas the target runtime is MaleCNS.
      - Source response values cannot be copied as MaleCNS physiology.
  - id: calle_schuler_et_al_2026
    citation: Calle-Schuler SA et al. (2026), A comprehensive mechanosensory connectome reveals a somatotopically organized neural circuit architecture controlling stimulus-aimed grooming of the Drosophila head
    doi: 10.7554/eLife.108044.3
    used_claims:
      - Three published aBN2 FlyWire cells have types CB1740, CB3129 and CB1779 in the pinned annotation dump.
      - aBN2 is a subset of the LB23 hemilineage, not the whole LB23 population.
    applicability_limits:
      - Developmental lineage alone is insufficient to identify MaleCNS aBN2 cells.
  - id: flywire_annotations_a83b277
    citation: FlyConnectome systematic FlyWire annotations, commit a83b2776d60d5764cef36b927f5f9679c16c47a2
    url: https://github.com/flyconnectome/flywire_annotations/tree/a83b2776d60d5764cef36b927f5f9679c16c47a2
    used_claims:
      - Pinned FlyWire root IDs map to systematic cell-type names used for cross-connectome matching.

