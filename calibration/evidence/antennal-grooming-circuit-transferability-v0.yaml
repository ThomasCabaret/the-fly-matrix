schema_version: 1
id: evidence.antennal_grooming_circuit_transferability.v0
title: Cross-connectome transferability audit for an independent antennal circuit reference
status: runnable_mapping_audit
claim_label: CIRCUIT REFERENCE MAPPING ONLY / NO FITTING / NO BEHAVIOR CLAIM
primary_class: evidence_transfer
optimization_exposure: diagnostic_only

purpose: >-
  Test whether the independently evaluated FlyWire antennal mechanosensory
  circuit can be identified in MaleCNS before locking it as a neural-model-class
  reference. This recipe may establish identities and structural paths only; it
  must not choose neural parameters or score visible grooming behavior.

