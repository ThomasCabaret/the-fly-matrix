notes:
  - This DAG orders parameter-family acceptance; targets and campaigns add their own dependency edges.
  - Independent roots may be processed in parallel.
  - A joint campaign may replace an edge only with a versioned non-identifiability reason.
  - Basal families remain roots; their two explicit source bridge families are downstream conversion capacity, not accepted values.
  - Same-native event-to-event and graded-to-graded efficacy remains in the central synaptic-efficacy family; only cross-native conversion is a separate family.
  - The FeCO native bridge is a separate external sensory boundary. Its joint-identifiability declaration does not merge it with central efficacy or internal cross-native conversion.
