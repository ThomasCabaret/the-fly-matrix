schema_version: 1
id: target.technical_neural_dynamics.v0
title: Bounded and recoverable MaleCNS temporal dynamics
status: runnable
primary_class: technical
optimization_exposure: allowed
claim_label: trained_technical_stability

scope:
  includes:
    - MaleCNS temporal neuron and synapse dynamics
    - declared basal inputs used by the runtime
    - typed or global dynamic parameter families
  excludes:
    - named actions, trajectories, gaits, and task success
    - structural rewiring
    - external behavioral control

metrics:
  - finite_state_fraction
  - active_neuron_fraction
  - persistently_quiescent_fraction
  - persistently_saturated_fraction
  - perturbation_amplification
  - perturbation_recovery_time
  - activity_distribution_by_declared_neuron_class

acceptance_policy:
  summary: >-
    Values remain finite and bounded, the system is neither globally irreversibly
    silent nor dominated by runaway saturation, and a small perturbation has a
    measurable but recoverable effect.
  thresholds:
    finite_state_fraction_min: 1.0
    active_fraction: {min: 0.01, max: null, cutoff: 0.0001}
    saturated_fraction_max: {value: 0.01, cutoff: 0.95}
    perturbation_peak_gain_max: 2.0
    perturbation_final_gain_max: 0.25
    stable_half_recovery_ms_max: 100
  threshold_class: preregistered_engineering_convention_v0_not_biological
  criticality: not_assumed_or_targeted

behavior_targets: []
scenario_splits:
  train: [central_technical_train_low_v0, central_technical_train_nominal_v0, central_technical_train_high_v0]
  validation: [central_technical_validation_low_v0, central_technical_validation_high_v0]
  diagnostic: []
  held_out: []

dependencies:
  - temporal MaleCNS runtime
  - deterministic seed control
  - compact activity metrics
  - measured CPU reference and GPU sparse execution benchmark

provenance:
  sources:
    - calibration/diagnostics/central-unfitted-regimes-v0.yaml
    - calibration/runner/central-unfitted-characterization-result-v0.yaml
  assumptions:
    - No biological source supports exact activity fractions for this abstract rate model; the v0 thresholds are deliberately broad engineering exclusion bands.
    - The complete diagnostic grid informed failure classes, but no individual diagnostic probe is a candidate or validation case.

validation: unfitted_baseline_characterized_not_fitted
blocked_reason: null
next_action: >-
  Execute campaign.technical_neural_dynamics_pilot.v0 and retain the full
  admissible ensemble without selecting a preferred behavior or visual result.
