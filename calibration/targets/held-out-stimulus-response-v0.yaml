schema_version: 1
id: target.held_out_stimulus_response.v0
title: Held-out bounded and stimulus-specific embodied response
status: proprioceptive_resistance_reflex_control_recalibration_complete_schedule_revision_pending
primary_class: evaluation_only
optimization_exposure: evaluation_only
claim_label: held_out_system_evaluation
candidate_catalog_ref: calibration/evaluation_candidates/emergent-behavior-catalog-v0.yaml
protocol_lock_status: v1_locked_zero_outcomes_v2_native_control_schedule_pending
protocol_ref: calibration/protocols/first-held-out-proprioceptive-resistance-reflex-v1.yaml

scope:
  includes:
    - complete frozen unranked 11-member FH-07 technical ensemble
    - short-horizon embodied simulation
    - stimulus, sham, and mirrored trials where meaningful
  excludes:
    - use in loss, model selection, early stopping, or manual parameter selection
    - a prescribed jump, gait, grooming sequence, or exact trajectory

candidate_stimulus_families:
  - passive_front_leg_femur_tibia_displacement
  - localized_contact
  - simultaneous_multi_region_contact
  - looming_visual_object
  - mirrored_tactile_or_visual_stimuli
  - directional_visual_field_motion
  - prolonged_visual_motion
  - nominal_no_stimulus

metrics:
  - response_latency
  - response_magnitude_relative_to_sham
  - trial_repeatability
  - mirrored_stimulus_sensitivity
  - anatomical_or_directional_specificity
  - topology_control_gap
  - post_stimulus_boundedness
  - recovery_to_non_runaway_state

acceptance_policy:
  summary: >-
    Frozen parameters yield a repeatable time-locked response that differs from
    sham and remains bounded. The protocol does not require a named action.
  thresholds: >-
    For each member and side, at least seven of eight paired seeds must have the
    source-consistent signed neural effect (exact one-sided sign-test tail
    0.03515625). No simulator-unit magnitude threshold is introduced.

scenario_splits:
  train: []
  validation: []
  diagnostic: []
  held_out:
    - heldout.proprio.resistance.v0/{topology_variant}/{member_id}/{side}/{condition}/seed-{seed}

contamination_policy: >-
  Any parameter or model-selection change made after inspecting this protocol's
  outcomes contaminates version v0 and requires a newly registered held-out
  protocol before a held-out claim.

dependencies:
  - frozen exact unranked FH-07 technical ensemble
  - accepted technical neural and embodied stability targets
  - accepted actuator semantics and mechanism-coverage statements
  - locked scenario generator and seeds
  - accepted local sensory chain for the selected stimulus modality
  - accepted local motor readout chain for the selected response scope

provenance:
  sources:
    - docs/prospective-emergent-behavior-evaluations.md
    - calibration/evaluation_candidates/emergent-behavior-catalog-v0.yaml
    - calibration/evaluations/first-held-out-channel-readiness-v0.yaml
    - https://doi.org/10.7554/eLife.56754
    - https://doi.org/10.1016/j.neuron.2018.09.009
  assumptions:
    - The 8 degree passive extension and 123 degree-per-second ramp are source-aligned assay coordinates, not a simulator optimum.
    - Biological evidence fixes response direction but not a transferable simulator-unit magnitude threshold.
    - Completing the FeCO proprioceptive chain alone does not make localized tactile contact runnable; mechanosensory routing and transfer readiness are separate gates.
    - FH-01 selected a proprioceptive resistance-reflex candidate from evidence and readiness before any simulated outcome was viewed.
    - FH-01 candidate selection was not a lock; FH-08 subsequently locked protocol v0 while keeping every response property forbidden during fitting and model selection.

validation: locked_not_executed
blocked_reason: null
next_action: >-
  Compile and lock protocol/schedule v2 outcome-blind from the exact recalibrated
  control ensembles (14, 15, 4 and 8 members) while retaining all eleven canonical
  members and the same eleven for frozen-parameter rewires. Then execute FH-09
  exactly once and account every scheduled episode. Never force equal control
  cardinalities or rank the canonical ensemble from the response.
