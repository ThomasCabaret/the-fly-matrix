schema_version: 1
id: target.technical_embodied_stability.v0
title: Neutral embodied closed-loop stability on flat ground
status: bounded_pilot_schedule_complete_execution_not_started_stability_not_calibrated
primary_class: technical
optimization_exposure: allowed
claim_label: trained_technical_stability

scope:
  includes:
    - declared MaleCNS runtime ensemble or accepted central parameters
    - declared sensory and motor interface parameters
    - basal-source parameters
    - simulator parameters explicitly admitted by a campaign
  excludes:
    - a prescribed pose sequence, gait, step timing, or named action
    - task reward
    - external stabilization controller

environment:
  scene: simple_flat_ground
  stimulus: nominal_or_sham

metrics:
  - simulation_completion
  - finite_cns_state_fraction
  - body_orientation_bounds
  - center_of_mass_displacement_when_recorded_not_root_position_relabelled
  - joint_limit_violation_count
  - contact_instability_count
  - biological_or_declared_surrogate_actuator_energy
  - physical_body_jerk_not_command_slew
  - recovery_after_small_generic_perturbation

measurement_contract:
  campaign_id: campaign.embodied_measurement_contract.v1
  evaluation_id: evaluation.embodied_measurement_contract.v1
  runner_result_id: runner_result.embodied_measurement_contract.v1
  status: complete_short_horizon_measurement_contract_stability_unresolved
  supported_groups:
    - time_finitude_and_cadence
    - mass_weighted_center_of_mass
    - exact_joint_limits
    - physical_com_kinematics_and_jerk
    - ground_contacts_and_force_norms
    - declared_direct_motor_work_proxy
    - numerical_joint_and_gross_fall_masks
    - paired_generic_perturbation_recovery
    - deterministic_reset_repeatability
  explicit_gaps: 0_for_short_horizon_technical_pilot
  optimized_parameters: 0
  selected_thresholds: 0
  note: >-
    The v1 paired passive fixture records true model COM, exact joint limits,
    physical COM jerk, contacts, a declared direct-motor work proxy, paired
    recovery and failure masks. Biological energy remains explicitly unclaimed.

acceptance_policy:
  summary: >-
    The coupled simulation remains finite, bounded and recoverable for the declared
    short horizon without prescribing a recognizable action.
  thresholds: generic_engineering_invariants_preregistered_metric_specific_biological_bounds_unresolved

pilot_schedule:
  campaign_id: campaign.neutral_embodied_stability_pilot.v0
  schedule_result_id: runner_result.neutral_embodied_stability_pilot_schedule.v0
  status: exact_120_tuple_schedule_complete_execution_not_started
  tuples: 120
  paired_physical_episodes: 240
  coverage:
    intermediate_profiles: 50_of_50
    feco_alternatives: 24_of_24
    motor_kernel_executable_assignments: 120_of_1024
    motor_kernel_executable_unscheduled: 904
    motor_slow_containing_blocked: 58025
    route_basis_edges: 110_of_110
    bridge_gains: 3_of_3
  parameter_values_promoted: 0
  stability_accepted: false

behavior_targets: []
scenario_splits:
  train: []
  validation: []
  diagnostic: []
  held_out: []

dependencies:
  - target.technical_neural_dynamics.v0 bounded admissible ensemble or accepted parameter set
  - target.actuator_semantics_gate.v0 accepted or explicitly bounded actuator surrogate
  - executable body-world-connectome closed loop
  - fixed simple 3D scene protocol

provenance:
  sources: []
  assumptions:
    - Neutral stability is an engineering target, not an emergent-behavior claim.

validation: measurement_contract_v1_pass_pilot_schedule_complete_execution_not_started
blocked_reason: >-
  The complete short-horizon measurement contract and an exact bounded readiness
  schedule are now registered, but the execution adapter and physical panel have
  not run. The schedule freezes non-scoped motor outputs to zero, so it cannot
  establish whole-body stability. Basal-source values and local motor transfers
  remain unresolved. The direct-motor semantics are accepted only as a bounded
  short-horizon surrogate.
next_action: >-
  Implement the exact schedule execution adapter, run a contract sentinel, then
  execute the bounded 120-tuple panel if the runtime and compute budget gates pass.
  Retain every failure and do not select interface candidates from body motion.
