validation: measurement_contract_v1_pass_full_panel_pass_declared_parameter_envelope_schedule_pass_execution_and_stability_not_run
blocked_reason: >-
  The complete measurement contract, exact schedule, both sentinels and the full
  local panel pass. The panel executes FeCO source functions, scheduled
  graded/event input, all 150 typed intermediate bodies, ten event motor bodies,
  the frozen physical adapter and 240 paired MuJoCo episodes for 120/120 tuples,
  with zero error, nonfinite pair or skip. This closes implementation robustness
  over the scheduled local panel, not calibration: its round-robin FeCO
  projection, unresolved-sign candidate and neural constants are visible
  diagnostic fixtures with zero promotion. The local corridor cannot establish
  whole-body stability, basal sources remain unresolved, and direct motors remain
  a bounded surrogate.
next_action: >-
  Execute a bounded neural sentinel over the exact 240-tuple declared envelope
  before spending physical-simulation budget. It must consume the channel-group
  FeCO routing profiles, balanced unknown-sign profiles and numeric profiles rather
  than the prior round-robin and fixed-sign fixtures. Mechanics and actuator
  semantics stay frozen, and neither neural magnitude nor later body motion may
  select an interface candidate.
