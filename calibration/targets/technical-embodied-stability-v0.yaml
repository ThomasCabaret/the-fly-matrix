validation: FH07a_138_of_138_finite_18_unranked_neural_technical_survivors_zero_body_outcomes_FH07b_physical_gate_open
blocked_reason: >-
  The complete measurement contract, exact schedule, earlier implementation
  sentinels and the full
  local panel pass. The panel executes FeCO source functions, scheduled
  graded/event input, all 150 typed intermediate bodies, ten event motor bodies,
  the frozen physical adapter and 240 paired MuJoCo episodes for 120/120 tuples,
  with zero error, nonfinite pair or skip. This closes implementation robustness
  over the scheduled local panel, not calibration: its round-robin FeCO
  projection, unresolved-sign candidate and neural constants are visible
  diagnostic fixtures with zero promotion. The new declared-envelope causal
  sentinel removes the future-normalized sinusoid: it registers bilateral
  front-knee geometry, executes persistent neuronal/delay/twitch state at the
  native 0.1 ms physics step, and completes 16/16 fixed-stride tuples as 32/32
  paired episodes. Five tuples deliver a nonzero causal command to exactly their
  scheduled actuator. The exhaustive follow-up accounts all 240 rows but fails
  its locked all-episodes criterion: 237 rows finish both branches and rows 029,
  041 and 149 are stopped before an over-limit direct-MOTOR command can be
  applied. The frozen sentinel traces reproduce under simulator reuse, so this is
  not reset drift. No clipping or survivor promotion is allowed. This is still an
  execution gate, not stability. The local corridor cannot establish whole-body
  stability, basal sources remain unresolved, and direct motors remain a bounded
  surrogate. The follow-up locked diagnostic reproduces all six failed branches
  twice and localizes every first crossing before application at 63.4--103.6 ms,
  with finite attempted commands 0.0100088--0.0100577. The preregistered
  one-factor follow-up retains its negative result: all six middle-gain probes
  complete, but ten numeric-ablation branches still cross. Moreover, each numeric
  profile in the original schedule is paired with only one gain, so their main
  effects are not separately identifiable. The accepted policy therefore closes
  only exact schedule accounting: 237 rows may enter the next technical gate and
  rows 029, 041 and 149 remain blocked. No broad domain is rejected, no survivor
  is promoted and every unseen combination must execute the guard fail-closed.
  The next causal gate then executes 260 physical episodes over the 65 active
  admitted rows and reproduces every unperturbed baseline from its exact
  native-step command trace. Sixty-four rows show both command adaptation and a
  physical closed-versus-open state gap; row 028 shows neither under this probe.
  The other 172 admitted rows remain silent/non-informative rather than rejected.
  This proves that the stability observables can be causally attributed on most
  active routes, but it does not define a good direction, a threshold or an
  accepted stable member. The next preregistered validation then executes four
  new mirrored perturbations for all 65 active rows, with exact frozen-command
  controls, for 650 finite episodes. Three exact composites (129, 141 and 238)
  pass every locked paired non-amplification criterion, 61 are mixed or
  amplifying and row 028 remains non-identifiable. These three members are kept
  as an unranked local technical ensemble; no individual factor is inferred from
  the confounded schedule and whole-body stability remains unresolved. The next
  compiler reconstructs all three exact schedule rows into hash-addressed bundles
  but deliberately freezes no marginal family: sensory, central and motor factors
  remain coupled by member, while all six basal families are marked not exercised.
  This closes reproducibility of propagation, not local or global calibration.
  FH-07a now supersedes that historical readiness path for the active roadmap:
  23 behavior-naive pairwise profiles crossed with three population anchors and
  two basal-native mirrors produce 138 paired neural rows. All are finite and 18
  exact rows pass locked motor-response, occupancy and post-pulse recovery checks.
  No body observable was computed. These rows remain coupled, unranked technical
  coordinates; physical boundedness, recovery and complete FH-07 acceptance are
  still open.
next_action: >-
  Execute FH-07b over all 18 retained exact neural rows with the complete v1
  measurement contract, frozen mechanics and preregistered generic physical
  perturbations. Cover remaining sensory and motor axes by an outcome-blind,
  cost-bounded schedule. Retain failures and survivors without ranking; do not
  inspect or optimize a named action, pose, attractive motion or held-out result.
