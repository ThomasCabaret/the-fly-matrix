schema_version: 1
id: target.population_dynamics_assignment.v0
title: Assign defensible dynamics classes to bounded MaleCNS populations
status: active_front_leg_conversion_contracts_executable_chain_envelope_complete_150_intermediate_assignments_and_interface_values_unresolved
primary_class: technical
optimization_exposure: diagnostic_only
claim_label: population_model_assignment_no_behavior_claim

scope:
  includes:
    - one minimal sensory chain
    - one minimal motor chain
    - event, graded/rate, or dual-unresolved assignment per declared population
    - explicit event-to-graded and graded-to-event conversion boundaries
    - local residuals, units, delay policy and applicability limits
  excludes:
    - a universal homogeneous model-class claim
    - named behavior fitting or selection
    - global embodied stability fitting
    - arbitrary population classification from annotation names alone
    - promotion of comparator constants without independent evidence

metrics:
  - population_scope_accounting
  - evidence_coverage_by_assignment
  - local_reference_residual_by_candidate_class
  - conversion_boundary_unit_completeness
  - delay_policy_completeness
  - unresolved_assignment_ensemble_size

acceptance_policy:
  summary: >-
    Every population exercised by the selected local chain has an evidence-backed
    class, an explicit unresolved ensemble, or an exclusion. A local success may
    accept only that scope. No unclassified population receives a silent default.
  required_outcomes:
    - all scoped populations are accounted for
    - native input/output units and temporal semantics are explicit
    - conversion boundaries are named and tested
    - alternatives remain propagated where evidence is non-identifying
    - residuals are reported by population and candidate class
    - no named behavior or body trajectory selects an assignment
  threshold_class: preregister_before_execution

behavior_targets: []
scenario_splits:
  train: []
  validation: []
  diagnostic: [local_sensory_chain, local_motor_chain]
  held_out: [population_local_reference_not_used_for_parameter_choice]

dependencies:
  - model.malecns_event_capable_typed_hybrid.v0
  - frozen transmitter evidence prior
  - accepted canonical-neuron scope
  - local source mapping with explicit units

provenance:
  sources:
    - decisions/0016-event-capable-typed-hybrid-neural-runtime.md
    - calibration/evaluations/neural-model-class-gate-v0.yaml
  assumptions:
    - A population can remain dual-unresolved without blocking unrelated populations.
    - One circuit cannot promote its model class over all MaleCNS.
    - A conversion rule can carry calibration freedom but may not carry behavior policy.

validation: partial_pass_factorized_chain_360_of_360_endpoint_pairs_reachable_150_new_intermediates_dual_unresolved_24_sensory_alternatives_59049_motor_class_upper_bound_zero_values
blocked_reason: null
next_action: >-
  The first factorized chain envelope is complete: all 360 FeCO-to-motor endpoint
  pairs are reachable within three directed synapses, and the complete local
  one/two-hop envelope exposes 150 new non-endpoint neurons. Assign those neurons
  only as far as independent evidence permits and retain the rest as
  dual_unresolved; do not apply a homogeneous rate or LIF default. Preserve the
  24 FeCO source/representation alternatives, the factorized 59,049 motor-class
  upper bound, all 110 route basis edges and all three bridge gains. A separate
  acceptance decision must freeze or explicitly propagate local interface values
  before neutral embodied fitting; the missing slow temporal kernel remains an
  explicit blocker rather than a borrowed default.
