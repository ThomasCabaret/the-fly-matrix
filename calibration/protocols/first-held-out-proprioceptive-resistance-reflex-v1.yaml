biological_basis:
  sources:
    - id: azevedo_et_al_2020
      citation: Azevedo et al. (2020), A size principle for recruitment of Drosophila leg motor neurons, eLife 9:e56754
      doi: 10.7554/eLife.56754
      url: https://elifesciences.org/articles/56754
      supports:
        - passive femur-tibia movement evokes resistance-reflex input in tibia-flexor motor neurons
        - the published mechanical assay used approximately 8 degree flexion and extension displacements
        - passive extension produced excitatory postsynaptic responses across slow, intermediate and fast flexor classes
        - spike output is not required for a source-consistent neural response because fast and intermediate cells commonly remained subthreshold
    - id: mamiya_et_al_2018
      citation: Mamiya et al. (2018), Neural Coding of Leg Proprioception in Drosophila, Neuron 100:636-650.e6
      doi: 10.1016/j.neuron.2018.09.009
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6481666/
      supports:
        - FeCO contains position, movement-direction and vibration response classes
        - controlled ramp-and-hold tibia motion is an appropriate local proprioceptive stimulus family
  transfer_limits:
    - The source assay began near a 90 degree femur-tibia angle; v1 applies a relative displacement from the frozen simulator reset angle and does not add a pose controller.
    - The source reports an approximately 123 degree-per-second ramp; v1 uses 123.076923 degrees per second solely to represent the same 8 degree displacement in exactly 650 frozen physical steps.
    - Published calcium and intracellular measurements do not provide a transferable simulator-unit response magnitude threshold.

