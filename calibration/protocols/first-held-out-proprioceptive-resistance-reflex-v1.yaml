  predecessor_outcome_rows: 0
  reason: >-
    Outcome-blind FH-09 preflight found that the v0 continuous-time ramp was not
    representable within its own 1 us tolerance on the already frozen 100 us
    MuJoCo time step. V1 preserves the source-level 8 degree assay waveform and
    uses exactly 650 physical steps (65 ms), implying 123.076923 degrees per
    second instead of silently rounding v0 during execution.
  scientific_change: none_beyond_timebase_exact_discretization_within_source_precision

