  same_recipe_recalibrated_rewires:
    unit: complete_ensemble_side_rewire_seed
    member_level_rule: >-
      Apply the unchanged canonical 7-of-8 expected-direction rule independently
      to every native control member. Do not compare magnitudes across event and
      graded native units.
    ensemble_statistic: >-
      For each side, report the exact numerator, denominator and fraction of the
      complete ensemble whose member-level neural rule passes. Canonical ensemble
      support exceeds a recalibrated control only when its pass fraction is
      strictly larger for that rewire seed. Ties and representation-dependent
      conclusions are ambiguous, never silently broken.
    uncertainty_reporting:
      - retain every member-level native event and graded measurement
      - report exact pass numerators and denominators, not only fractions
      - report each rewire seed separately; do not pool the four controls
      - do not rank or select a control member from the held-out outcome

