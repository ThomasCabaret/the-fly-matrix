accepted_claims:
  - An explicit assignment vector, rather than a hidden global default, controls every active population.
  - The same sparse engine executes event and graded state plus all four boundary directions.
  - The complete basal-reached scope fits and advances on the available backend under both diagnostic extremes.
  - Event delivery is visible only at the declared comparator delay.
forbidden_claims:
  - Either diagnostic extreme is a biological population assignment.
  - Two extremes represent the complete 2^166419 assignment uncertainty.
  - The diagnostic constants are calibrated, physiological or promotable.
  - A source event process or Hz-to-graded basal conversion has executed.
  - Finite execution validates stability, behavior or the point-neuron approximation.

next_action: >-
  Define bounded source event-process and Hz-to-graded conversion families, then
  execute the preregistered basal sensitivity shapes through this engine while
  retaining population-assignment uncertainty and zero named-behavior exposure.
