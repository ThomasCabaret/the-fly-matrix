acceptance:
  - all five exact source files reproduce their SHA-256 hashes
  - all 23 active cells and three classes are accounted from executable source rows
  - the selected one-cell-per-class pilot accounts for exactly 194 declared trials
  - filters, duration and force-probe unit transforms remain explicit
  - absence of a variable schema and twitch time-course recipe remains a blocker
  - no value, body class, behavior or topology is selected

forbidden_claims:
  - the source plotting scripts alone identify a temporal twitch kernel
  - the 0.2234 spring constant is a complete motor transfer parameter
  - one selected cell estimates a population distribution
  - driver classes identify individual MaleCNS bodies

result:
