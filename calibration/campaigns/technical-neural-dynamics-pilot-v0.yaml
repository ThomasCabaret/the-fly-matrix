schema_version: 1
id: campaign.technical_neural_dynamics_pilot.v0
title: Constraint-based pilot fit of shared signed MaleCNS dynamics
status: runnable
target_ids: [target.technical_neural_dynamics.v0]
scope_ids: [scope.central_neural_dynamics.v0]
parameter_family_ids: [parameter.central.synaptic_efficacy.v0, parameter.central.neuron_dynamics.v0]
dependency_campaign_ids: [campaign.evidence_transmitter_sign_prior.v0]
parent_parameter_set_ids: [parameters.central_transmitter_sign_prior.v0]
output_parameter_set_id: parameters.central_technical_dynamics_pilot_ensemble.v0
claim_label: TRAINED TECHNICAL STABILITY PILOT / NOT PHYSIOLOGY / NO BEHAVIOR

topology_boundary:
  semantic_topology_hashes:
    parameter.central.transmitter_sign_prior.v0: canonical_malecns_runtime_graph
    parameter.central.synaptic_efficacy.v0: canonical_malecns_runtime_graph
    parameter.central.neuron_dynamics.v0: canonical_malecns_runtime_graph
  ruleset_hashes:
    transmitter_sign_prior: dcc838f16e6069c7dc8861b01c10e5b40fd52364dd7ca75e230a09bba03fef2e
  exception_table_hashes: {central_signed_dynamics: none}

method:
  kind: deterministic_scrambled_sobol_constraint_search
  implementation: src/the_fly_matrix/signed_dynamics.py
  candidate_count: 32
  sobol_seed: 64003
  evaluation_seed: 65003
  parameter_order:
    - time_constant_ms
    - input_gain
    - bias
    - acetylcholine
    - dopamine
    - gaba
    - glutamate
    - histamine
    - missing
    - octopamine
    - serotonin
    - unclear
  bounds:
    time_constant_ms: {transform: log, lower: 10.0, upper: 80.0, units: ms}
    input_gain: {transform: log, lower: 0.25, upper: 2.0, units: model_gain}
    bias: {transform: linear, lower: -0.02, upper: 0.02, units: model_drive}
    acetylcholine: {transform: positive_log, lower_abs: 0.05, upper_abs: 2.0, units: normalized_efficacy}
    dopamine: {transform: signed_log, lower_abs: 0.02, upper_abs: 1.5, units: normalized_efficacy}
    gaba: {transform: negative_log, lower_abs: 0.05, upper_abs: 2.0, units: normalized_efficacy}
    glutamate: {transform: signed_log, lower_abs: 0.02, upper_abs: 1.5, units: normalized_efficacy}
    histamine: {transform: signed_log, lower_abs: 0.02, upper_abs: 1.5, units: normalized_efficacy}
    missing: {transform: signed_log, lower_abs: 0.02, upper_abs: 1.5, units: normalized_efficacy}
    octopamine: {transform: signed_log, lower_abs: 0.02, upper_abs: 1.5, units: normalized_efficacy}
    serotonin: {transform: signed_log, lower_abs: 0.02, upper_abs: 1.5, units: normalized_efficacy}
    unclear: {transform: signed_log, lower_abs: 0.02, upper_abs: 1.5, units: normalized_efficacy}
  objective_terms:
    - constraint satisfaction only; no target activity value and no visual selection
  selection_rule: retain_all_candidates_passing_every_train_and_validation_gate
  ranking_rule: none_in_v0
  frozen_parameters: [canonical graph, transmitter labels, typed ACh/GABA sign constraints, activation function, normalization rule, dt_ms]
  compute_budget: 32 candidates times 5 scenarios times 80 steps on the full graph

simulation:
  backend: cuda:0
  dtype: float32
  dt_ms: 5.0
  steps: 80
  initial_state_std: 0.01
  perturbation_amplitude: 0.001
  perturbation_nodes: 1024
  numerical_activity_threshold: 0.0001
  numerical_saturation_threshold: 0.95
  cpu_gpu_atol: 0.00005
  cpu_gpu_rtol: 0.0005

scenario_splits:
  train:
    - {id: central_technical_train_low_v0, rng_seed: 66101, input_amplitude: 0.025}
    - {id: central_technical_train_nominal_v0, rng_seed: 66102, input_amplitude: 0.05}
    - {id: central_technical_train_high_v0, rng_seed: 66103, input_amplitude: 0.10}
  validation:
    - {id: central_technical_validation_low_v0, rng_seed: 66201, input_amplitude: 0.04}
    - {id: central_technical_validation_high_v0, rng_seed: 66202, input_amplitude: 0.075}
  diagnostic: []
  held_out: []

acceptance_thresholds:
  finite_state_fraction_min: 1.0
  active_fraction_min: 0.01
  saturated_fraction_max: 0.01
  perturbation_peak_gain_max: 2.0
  perturbation_final_gain_max: 0.25
  stable_half_recovery_step_max: 20
  rationale:
    finite_state_fraction_min: Exact numerical invariant.
    active_fraction_min: Rejects only near-global numerical silence at the declared 1e-4 activity cutoff; widespread low-amplitude activity is not treated as runaway.
    saturated_fraction_max: Rejects candidates with more than one percent of neurons within five percent of the tanh rail.
    perturbation_peak_gain_max: Allows a transient doubling but rejects stronger recurrent amplification.
    perturbation_final_gain_max: Requires at least 75 percent perturbation-norm decay by the 400 ms horizon.
    stable_half_recovery_step_max: Requires stable half recovery within 100 ms at the declared 5 ms step.
  evidence_class: preregistered_engineering_convention_v0
  biological_interpretation: none
  diagnostic_use: designed_from_failure_classes_across_complete_v0_grid_not_from_selecting_a_probe

capacity_policy:
  model_family: model.malecns_typed_signed_rate.v0
  degrees_of_freedom: 12
  automatic_capacity_increase_allowed: false
  joint_calibration_reason: Global temporal parameters and class efficacies compensate under technical response constraints and are not separately identifiable in this pilot.

behavior_exposure: {behavior_targeted: false, exposed_behavior_ids: [], contamination_notes: []}
reproducibility:
  command: fit_signed_dynamics_pilot.bat
  git_commit: resolved_by_runner
  environment: Python 3.12 plus NumPy SciPy PyTorch CUDA
  input_hashes: resolved_by_runner_job
result: {status: not_run, metrics: {}, artifact_refs: [], failures: [], decision: pending, admissible_solution_count: 0, uncertainty_artifact_refs: []}
acceptance:
  criteria_locked_before_run: true
  local_held_out_dataset_ids: []
  reproducibility_mode: deterministic_candidates_gpu_metrics_compared_at_4_significant_digits
  reproducibility_tolerances: {gpu_metrics: 4_significant_digits, cpu_gpu_one_step: [atol_5e-5, rtol_5e-4]}
reopening: {reopened_family_ids: [], reasons: [], stale_descendant_ids: []}
sources:
  - calibration/diagnostics/central-unfitted-regimes-v0.yaml
  - calibration/runner/central-unfitted-characterization-result-v0.yaml
  - calibration/models/malecns-typed-signed-rate-v0.yaml
assumptions:
  - Thresholds are conservative engineering conventions for v0, not biological firing-rate evidence.
  - Synthetic direct terminal inputs isolate central dynamics and make no peripheral-interface claim.
  - A pilot with no admissible candidate is a retained negative result and does not authorize wider bounds or greater model capacity.
next_action: Execute the immutable runner job, record all rejected candidates, and materialize the complete admissible ensemble without selecting a visual favorite.

