acceptance:
  - every retained source candidate has a finite nonconstant activation coordinate over admitted support
  - all normalized coordinates remain in the closed unit interval on admitted rows
  - all eight class-shared event/graded profiles are materialized
  - native baseline, dynamic range and event-process values remain unresolved and explicitly owned
  - no behavior, body motion or CNS threshold crossing is consumed
  - the parent routing and source-path ensemble remains unselected

