schema_version: 1
id: campaign.front_leg_motor_transfer_propagation.v1
title: Propagate the three motor-class transfer representations without selecting a body class or kernel
target_id: target.population_dynamics_assignment.v0
classification: evidence_transfer
optimization_exposure: diagnostic_only
claim_label: MOTOR TRANSFER FACTORIZED ENVELOPE / NO REFERENCE / NO BODY MOTION
behavior_targets: []
topology_changes_allowed: false

inputs:
  motor_class_ensemble:
    path: calibration/evidence/front-leg-motor-class-ensemble-v0.yaml
    sha256: 3595b0420bb815887d2d892ad5f9088e5af61a53ba38a7ef43c28277ac2304fa
  fast_intermediate_temporal_diagnostic:
    path: calibration/runner/motor-twitch-temporal-diagnostic-v0.yaml
    sha256: 7504de68154f7b6b602128849d9b3db946817678cad9fbedaf30cb61b7637478
  slow_tonic_diagnostic:
    path: calibration/runner/motor-slow-tonic-envelope-v0.yaml
