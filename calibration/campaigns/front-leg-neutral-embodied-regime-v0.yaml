accepted_claims:
  - Every FH-07a survivor was physically exercised at least once under a precomputed outcome-blind schedule.
  - The remaining declared sensory, motor and perturbation factors have complete pairwise level coverage.
  - Exact passing composites form an unranked short-horizon technical ensemble under frozen mechanics.
forbidden_claims:
  - A passing composite is physiological, preferred, globally stable or behaviorally valid.
  - Pairwise coverage resolves higher-order compensation or all FH-06 addresses.
  - Failure of one scheduled composite rejects its FH-07a parent under every motor or sensory address.
  - A finite or non-amplifying body trajectory demonstrates stance, reflex, locomotion or emergence.

parameter_set_interpretation: >-
  Exact physical composites retained only by preregistered behavior-naive technical
  checks. Body outcomes are legitimately consumed by this technical calibration,
  but no named behavior, attractive motion or evaluation-only response was exposed.
  Members remain unranked and no value becomes a physiological reference.

