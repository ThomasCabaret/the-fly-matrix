locked_rules:
  - every accepted member is reconstructed from exactly one frozen schedule row
  - no rejected silent non-identifiable or command-blocked row enters the bundle
  - sensory central and motor factors remain coupled by exact member id
  - no marginal factor level is promoted from exact-composite acceptance
  - no basal value or zero default is inferred from absence in the local schedule
  - no member is ranked or chosen as a reference

acceptance:
