accepted_claims:
  - The three local technical ensemble members are reconstructible as exact member-conditioned bundles.
  - Every involved parameter family has an explicit freeze disposition.
  - Basal families are accounted as not exercised and remain unresolved.
forbidden_claims:
  - Any sensory central motor or basal family is independently calibrated or frozen.
  - Any one member is preferred biologically or technically beyond the parent exact-composite gate.
  - The bundles establish whole-body stability physiology or behavior.
next_action: >-
  Use all three conditioned bundles in the first bounded whole-body technical
  sentinel while keeping basal hypotheses as a separately declared low-capacity
  uncertainty grid. Stop for the required human visual checkpoint before any
  inspection-driven tuning.
