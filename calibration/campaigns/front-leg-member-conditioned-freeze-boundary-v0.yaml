  first_checkpoint_kind: technical_embodied_preview
  held_out_behavior_opened: false
  policy: >-
    A future first whole-body run may be inspected by the user as a technical
    integration checkpoint. No automatic parameter changes may follow that
    inspection. Any change aimed at a named action creates an explicitly
    behavior-exposed lineage.

outputs:
