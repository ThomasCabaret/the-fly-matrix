schema_version: 1
id: campaign.front_leg_coupled_identifiability_design.v0
title: FH-05 owner-separated coupled-identifiability design on the front-leg cone
status: completed_static_design_dynamic_execution_pending
target_ids:
  - target.population_dynamics_assignment.v0
  - target.technical_neural_dynamics.v0
scope_id: scope.first_held_out_proprioceptive_resistance_reflex.v0
primary_class: technical
optimization_exposure: diagnostic_only
claim_label: FH-05 IDENTIFIABILITY DESIGN / ENGINEERING COORDINATES / NO VALUES / NO BEHAVIOR
behavior_targets: []
topology_changes_allowed: false
parameter_values_promoted: 0
population_assignments_promoted: 0

purpose: >-
  Compile the smallest explicit design that can expose compensation among FeCO
  native amplitude, basal source intensity, same-native synaptic efficacy,
  cross-native conversion, neuronal threshold distance and unknown-afferent
  policy on the frozen 196-neuron cone. This delivery verifies topology and
  factor coverage only. A later execution must run the preregistered anchors;
  neither this design nor a threshold crossing can select a value.

frozen_inputs:
  population_members:
    path: data/derived/calibration/population-dynamics-front-leg-v0/population-members.csv
    sha256: 01ee7bd3beb9f681bd5c90d7f8f20981917688239ad3d2c7c5c6f607c6d4b9b4
  classified_intermediates:
    path: data/derived/calibration/front-leg-intermediate-dynamics-accounting-v0/classified-intermediates.csv
    sha256: c5893516ff5a37f8dbbc90e40b5da1b0d31d19cf2a29763517be1a16defd1dcc
  intermediate_panel:
    path: data/derived/calibration/front-leg-uncertainty-propagation-v0/intermediate-assignment-panel.csv
    sha256: 4557f1bf7a999b4e3f71a6fd2d2f8d26b3b83ab1a654d46e2e20165d77f7cdc2
  central_nodes:
    path: data/derived/wiring/central-node-index.parquet
