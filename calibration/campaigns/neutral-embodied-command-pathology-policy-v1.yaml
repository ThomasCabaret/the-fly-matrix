accepted_claims:
  - The immutable schedule has a complete exact-row direct-MOTOR command disposition.
  - The three observed failing composites are blocked before invalid command application.
  - The remaining 237 rows may enter the next technical gate but are not selected or promoted.
  - The original schedule cannot independently estimate numeric-profile and gain main effects.
forbidden_claims:
  - A broad gain or numeric-profile domain is safe or invalid.
  - A neighboring factor value repairs, calibrates or validates an original row.
  - Any row is stable, physiological, behavioral or scientifically promoted.
  - An unseen combination may bypass the pre-application command guard.
next_action: >-
