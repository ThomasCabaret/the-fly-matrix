claim_label: LOCAL CONVERSION CONTRACT / SYNTHETIC STRUCTURE TEST / NO CALIBRATION
behavior_targets: []

topology_boundary:
  parameter.proprioception.transfer.v0:
    parameter_family_record: calibration/parameter_families/proprioception-transfer-v0.yaml
    semantic_topology_sha256: 782b98d147b5ecd15861dca0241d7fabf2995b1b9b6ef5b9c50d8e94ea5dd665
  parameter.motor.transfer.v0:
