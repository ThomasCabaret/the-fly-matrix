source_bridge_contracts:
  event_process:
    family_id: parameter.bridge.basal_event_process.v0
    input_units: spikes_per_second
    output_units: event_presence_per_timestep
    candidate_form: independent_homogeneous_poisson_presence
    probability: 1_minus_exp_minus_rate_hz_times_dt_seconds
    multiplicity_policy: multiple_events_from_one_source_inside_one_step_collapse_to_presence
    required_guard: maximum_presence_probability_per_step
  graded_conversion:
    family_id: parameter.bridge.basal_hz_to_graded.v0
    input_units: spikes_per_second
    output_units: dimensionless_graded_drive
    candidate_form: rate_divided_by_rate_plus_half_saturation
    invariants: [zero_preserving, monotone, finite, bounded_below_one]
    unresolved_capacity: [half_saturation_hz, optional_shared_temporal_filter]

diagnostic_execution:
  status: UNPROMOTABLE_ENGINEERING_FIXTURES
  arms: [explicit_silence_control, uniform_per_terminal, equal_family_mass]
  assignment_profiles:
    - exact_event_plus_all_dual_as_graded
    - all_reached_as_event_candidate
  steps: 96
  dt_ms: 0.1
  seed_by_arm:
    explicit_silence_control: 1729
    uniform_per_terminal: 2718
    equal_family_mass: 3141
  uniform_per_terminal_fixture_hz: 20.0
  equal_family_total_fixture_hz: 5000.0
  graded_half_saturation_fixture_hz: 100.0
  restriction: >-
    These values exist only to exercise mechanics and alias guards. They are not
    physiological estimates, priors, accepted bounds, fitted values, population
    assignments or candidates for promotion.

acceptance:
  expected_terminals: 6041
  expected_family_terminals:
    parameter.baseline.gustation.v0: 1428
    parameter.baseline.olfaction.v0: 2639
    parameter.baseline.thermohygro.v0: 91
    parameter.residual_sensory.chemosensory_nominal.v0: 57
    parameter.residual_sensory.mechanosensory_tbc_nominal.v0: 11
    parameter.residual_sensory.unknown_nominal.v0: 1815
  max_event_presence_probability_per_step: 0.05
  require_every_terminal_exactly_once: true
  require_all_three_arms_both_profiles: true
  require_event_and_graded_paths_exercised: true
  require_seeded_schedule_hashes: true
  require_inactive_state_quiescent: true
  require_zero_population_assignment_promotion: true
  require_zero_parameter_promotion: true
  require_zero_named_behavior_exposure: true

accepted_claims:
  - All 6,041 basal terminals have executable candidate bridges for event and graded ports.
  - All three preregistered low-capacity input shapes execute under both diagnostic assignment extremes.
  - Event sampling is seeded and collision risk is bounded by an explicit per-step presence limit.
  - The graded conversion is explicit, zero-preserving, monotone and bounded.
forbidden_claims:
  - Any diagnostic rate, scale, seed or time course is physiological, fitted or accepted.
  - Either assignment extreme identifies native dynamics for any dual-unresolved population.
  - Independent Poisson sources or the saturating conversion are biologically validated.
  - Finite execution calibrates a basal family, central dynamics, stability or behavior.
  - Any named behavior has been trained, evaluated or visually selected.

outputs:
  compact_result: calibration/runner/basal-source-bridge-mechanics-v0.yaml
  evaluation: calibration/evaluations/basal-source-bridge-mechanics-v0.yaml
  ignored_diagnostics: data/derived/calibration/basal-source-bridge-mechanics-v0/

next_action: >-
  Source or bound finite basal-rate and conversion-scale ensembles per family,
  retain event and graded alternatives wherever the population assignment remains
  dual-unresolved, then propagate that finite ensemble into the first local
  sensor-CNS-motor chain without named-behavior selection.
