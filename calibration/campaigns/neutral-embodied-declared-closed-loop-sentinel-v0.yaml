schema_version: 1
id: campaign.neutral_embodied_declared_closed_loop_sentinel.v0
title: Causal neutral body-neural-body execution sentinel
status: preregistered_ready_to_run
target_ids:
  - target.population_dynamics_assignment.v0
  - target.technical_embodied_stability.v0
scope_ids:
  - scope.front_leg_sensor_cns_motor_chain.v0
parameter_set_id: parameters.neutral_embodied_declared_envelope.v0
primary_class: technical
optimization_exposure: diagnostic_only
claim_label: CAUSAL CLOSED-LOOP SENTINEL / NO FIT / NO SELECTION / NOT STABILITY / NO BEHAVIOR
behavior_targets: []
topology_changes_allowed: false

purpose: >-
  Replace the sinusoidal joint fixture by actual bilateral FlyBody femur-tibia
  geometry and execute a small, fixed subset of the passed 240-tuple envelope in
  a causal body-to-FeCO-to-typed-population-to-motor-to-body loop. This closes a
  coordinate-registration and execution gate only. It cannot rank, select,
  calibrate or promote a candidate from neural magnitude or body motion.

