  declared_neural_campaign: calibration/campaigns/neutral-embodied-declared-neural-sentinel-v0.yaml
  declared_neural_campaign_sha256: 0518c5849230be16f6dfc90e7c5de2270cb66fdd88a782f6b814b5769d7b781d
  declared_neural_result: calibration/runner/neutral-embodied-declared-neural-sentinel-v0.yaml
  declared_neural_result_sha256: 7cb4dee9d22fe9a9f3d169dcbefefd48fe169c9242c8a01960543c8c159559ed
