schema_version: 1
id: campaign.neutral_embodied_full_chain_sentinel.v0
title: Neutral embodied full local-chain execution sentinel
status: preregistered_ready_to_run
target_id: target.technical_embodied_stability.v0
scope_id: scope.front_leg_sensor_cns_motor_chain.v0
primary_class: technical
optimization_exposure: diagnostic_only
claim_label: FULL LOCAL-CHAIN SENTINEL / DIAGNOSTIC CANDIDATES / NOT CALIBRATION / NOT STABILITY / NO BEHAVIOR / NO SELECTION
behavior_targets: []
topology_changes_allowed: false

purpose: >-
  Replace the synthetic event used by the motor-only adapter sentinel with an
  actually executed bounded path: synthetic joint kinematics, one scheduled FeCO
  source-path/native-representation alternative, all 150 typed intermediate
  bodies, all ten event-required motor bodies, the frozen motor adapter and paired
  MuJoCo episodes. This closes an execution-plumbing gate only. Every numeric CNS
  constant and every unresolved sign/class choice remains a declared diagnostic
  candidate with zero scientific promotion.

frozen_inputs:
  adapter_campaign: calibration/campaigns/neutral-embodied-adapter-sentinel-v0.yaml
  adapter_campaign_sha256: 64a2f4e4ba14c02e52823ca2c4012884d3621cec42889b6e24be63300caeaad5
  central_paths: data/derived/calibration/front-leg-sensor-cns-motor-chain-v0/central-paths-up-to-two-hops.csv
  population_members: data/derived/calibration/population-dynamics-front-leg-v0/population-members.csv
  classified_intermediates: data/derived/calibration/front-leg-intermediate-dynamics-accounting-v0/classified-intermediates.csv
  transmitter_priors: data/derived/calibration/transmitter-sign-prior-v0/neuron-priors.parquet

frozen_input_sha256:
  central_paths: e26d05333d56e779c1b3cbb87d00635350fde34df355b79728a87475741aec4f
  population_members: 01ee7bd3beb9f681bd5c90d7f8f20981917688239ad3d2c7c5c6f607c6d4b9b4
  classified_intermediates: c5893516ff5a37f8dbbc90e40b5da1b0d31d19cf2a29763517be1a16defd1dcc
  transmitter_priors: f7f129585ba0e516c824fc5bb5b9e53f2a62c2203405b1fd8b01c7e5cee5162a

sentinel_selection:
  policy: same_fixed_tuple_ids_as_passed_motor_adapter_sentinel
  tuple_ids: [neutral_tuple_000, neutral_tuple_001, neutral_tuple_002, neutral_tuple_119]
  selected_from_body_motion: false
  coverage_intent:
    - both FeCO native-representation candidates
    - all-event, all-graded and mixed intermediate profiles
    - both executable motor classes
    - all three bridge gains

synthetic_joint_fixture:
  kind: sinusoidal_front_leg_femur_tibia_angle
  center_deg: 80.0
  amplitude_deg: 20.0
  frequency_hz: 10.0
  meaning: >-
    A deterministic engineering excitation that makes the three documented FeCO
    source functions observable. It is neither a neutral-body measurement nor a
    fly behavior and cannot select any candidate.

typed_execution_probe:
  timestep_s: 0.0001
  timestep_units: seconds
  transmission_delay_s: 0.0018
  transmission_delay_status: source_traceable_fixed_comparator_not_morphology_resolved
  synaptic_tau_s: 0.005
  intermediate_membrane_tau_s: 0.010
  motor_membrane_tau_s: 0.010
  intermediate_refractory_s: 0.005
  motor_refractory_s: 0.020
  event_threshold_normalized: 1.0
  intermediate_input_gain: 3.0
  motor_input_gain: 6.0
  source_event_intensity_max_hz: 200.0
  endpoint_functional_projection: sorted_body_id_round_robin_three_class_diagnostic_only
  unknown_sign_diagnostic_candidate: 1
  unknown_sign_candidate_meaning: >-
    A visible excitatory execution candidate for sign_code=0 sources. Zero means
    no sign assertion in the accepted prior; this choice is not biological
    evidence and may not be promoted or hidden in a later campaign.
  connection_weight_policy: normalize_each_local_target_by_total_unsigned_synapse_count
  event_to_graded_boundary: causal_exponential_event_count_state_dimensionless_probe
  graded_to_event_boundary: explicit_normalized_drive_into_thresholded_refractory_unit
  parameter_values_promoted: 0

physical_protocol:
  scene: simple_flat_ground
  frames: 40
  physics_substeps_per_frame: 50
  expected_frame_dt_s: 0.005
  perturbation_step: 10
  perturbation:
    id: generic_lateral_root_velocity_impulse
    qvel_address: 1
    delta: 0.1
    units: FlyBody_model_length_units_per_second
  paired_branches: [identical_reset_baseline, generic_qvel_perturbation]

acceptance:
  scheduled_tuples_loaded: 120
  sentinel_tuples: 4
  paired_physical_episodes: 8
  expected_feco_endpoints: 36
  expected_intermediate_bodies: 150
  expected_motor_bodies: 10
  require_every_tuple_accounted: true
  require_feco_nonzero_drive: true
  require_intermediate_nonzero_state: true
  require_motor_events_somewhere_in_scoped_pool: true
  require_finite_physical_arrays: true
  require_non_scoped_motor_outputs_zero: true
  require_exact_frozen_hashes: true
  allow_route_body_silence: true
  allow_physical_magnitude_to_select_candidate: false
  stability_acceptance_possible: false

scientific_boundary:
  optimized_parameters: 0
  promoted_parameter_values: 0
  selected_candidates: 0
  named_behavior_exposure: 0
  local_chain_execution_contract_only: true
  population_assignment_acceptance_possible: false
  whole_body_stability_claimed: false

compute_budget:
  physical_episodes: 8
  simulated_seconds: 1.6
  maximum_wall_clock_minutes: 20
  no_automatic_budget_extension: true

accepted_claims:
  - The fixed sentinel tuples execute every declared local stage from FeCO source functions through paired MuJoCo physics.
  - Event and graded intermediate candidates coexist in one event-capable typed execution path with explicit conversion and delay boundaries.
  - The local graph, schedule, population inventories and physical adapter remain hash-frozen and no unscoped actuator receives a command.
forbidden_claims:
  - Any probe constant, unknown sign, functional projection, native representation, population assignment, motor class, route or gain is calibrated or selected.
  - The diagnostic round-robin FeCO endpoint projection is a biological claw/club/hook map.
  - A passing execution sentinel establishes neural stability, embodied stability or behavior.
  - The bounded two-hop corridor is a complete model of the full MaleCNS recurrent dynamics.
next_action: >-
  If all four tuples pass, run the immutable 120-tuple local panel with the same
  execution contract and retain every failure. Analyze robustness only over the
  scheduled tuples; do not rank candidates from body motion and do not promote
  these diagnostic neural constants.
