schema_version: 1
id: campaign.basal_low_capacity_readiness.v0
title: Low-capacity basal sensitivity design and whole-MaleCNS execution readiness gate
status: preregistered_ready_to_run
target_ids:
  - target.population_dynamics_assignment.v0
  - target.technical_embodied_stability.v0
primary_class: technical
optimization_exposure: diagnostic_only
claim_label: BASAL DESIGN READINESS / ZERO BASAL VALUES / NOT WHOLE-MALECNS EXECUTION / NO BEHAVIOR
behavior_targets: []
topology_changes_allowed: false

purpose: >-
  Account for all six basal families, preregister the smallest behavior-naive
  sensitivity shapes that could later be instantiated, and refuse numerical
  basal values or a whole-MaleCNS run until every consumed population has an
  accepted typed/hybrid assignment and an explicit unit conversion contract.

