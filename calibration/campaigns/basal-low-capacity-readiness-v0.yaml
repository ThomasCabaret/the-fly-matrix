  typed_hybrid_runtime_sha256: 922a21b533d52d5cb6be435c31aee3e48a4616c7e72e87a835ff510ae4af49d0

expected_accounting:
  basal_families: 6
  basal_channels: 2212
  basal_terminals: 6041
  canonical_MaleCNS_neurons: 166700
  currently_accounted_local_population_neurons: 196
  currently_event_required_local_neurons: 12
  currently_dual_unresolved_local_neurons: 184
  basal_reached_population_neurons: 166431
  basal_reached_event_required_neurons: 12
  basal_reached_dual_unresolved_neurons: 166419
  basal_unreached_neurons: 269

sensitivity_design:
  status: preregistered_shapes_only_absolute_scales_blocked
  common_rules:
    - Every terminal in every family must be accounted for in every arm.
    - No arm may be selected from a named behavior or visual inspection.
    - Event populations require event intensity units; graded populations require an explicit conversion contract.
    - Absolute scales, seeds and time courses remain unset until the typed/hybrid consuming scope is accepted.
  arms:
    - id: explicit_silence_control
      shape: zero_input_for_every_basal_terminal
      role: negative_control_only_not_a_default
    - id: uniform_per_terminal
      shape: one_shared_unresolved_scale_per_terminal
      role: tests_sensitivity_to_total_terminal_count
    - id: equal_family_mass
      shape: one_shared_unresolved_total_mass_per_family_distributed_within_family
      role: tests_whether_large_families_dominate_only_by_cardinality

execution_gates:
  - id: complete_consumed_population_disposition_accounting
    required: true
  - id: explicit_event_or_graded_unit_bridge_per_consumed_population
    required: true
  - id: no_legacy_normalized_rate_comparator_for_scientific_claim
    required: true
  - id: every_basal_family_consumed_or_explicitly_excluded
    required: true

acceptance:
  require_all_families_accounted: true
  require_zero_numeric_basal_values: true
  require_zero_named_behavior_exposure: true
  require_honest_block_if_only_local_population_assignment_exists: true
  whole_MaleCNS_execution_acceptance_possible: false

outputs:
  compact_result: calibration/runner/basal-low-capacity-readiness-v0.yaml
  evaluation: calibration/evaluations/basal-low-capacity-readiness-v0.yaml
  derived_design: calibration/parameter_sets/basal-low-capacity-sensitivity-design-v0.yaml

accepted_claims:
  - The low-capacity uncertainty axes are preregistered without physiological values.
  - Every currently declared basal family is accounted for.
  - The gate identifies whether a typed/hybrid whole-MaleCNS execution can honestly consume these families.
forbidden_claims:
  - Any basal magnitude, rate or time course is calibrated or physiologically accepted.
  - The three local front-leg bundles cover the complete recurrent MaleCNS graph.
  - The historical normalized-rate comparator satisfies the accepted typed/hybrid contract.
  - Any named behavior, whole-body stability or emergence has been tested.
next_action: >-
  Define the event-process and Hz-to-graded source bridges for all 6,041 basal
  terminals, then instantiate every preregistered arm over explicit typed/hybrid
  candidate profiles with a bounded absolute-scale axis. Do not select a native
  population assignment from runtime convenience or a named behavior.
