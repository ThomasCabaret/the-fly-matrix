acceptance:
  expected_families: 6
  expected_unique_source_terminals: 6041
  expected_canonical_neurons: 166700
  expected_preaccepted_event_bodies: 12
  require_disjoint_family_sources: true
  require_every_source_canonical: true
  require_every_reached_neuron_assigned: true
  require_no_edge_from_reached_to_unreached: true
  require_every_source_bridge_disposition: true
  require_zero_numeric_values: true
  require_zero_named_behavior_exposure: true

accepted_claims:
  - Every canonical neuron reachable from the six basal families has an explicit event-required or dual-unresolved disposition.
  - Every basal source terminal has an explicit native-input bridge disposition.
  - Internal event/graded boundary combinations are exhaustively named and counted without values.
forbidden_claims:
  - Dual-unresolved populations have an accepted native representation.
  - A named bridge disposition is executable or calibrated.
  - The accepted local event requirements generalize to other bodies sharing an annotation.
  - Basal values, whole-body stability or a named behavior have been tested.
next_action: >-
  Use the exact reachability and boundary counts to implement a sparse typed/hybrid
  runtime that preserves dual alternatives. Resolve or bound the source event-process
  and graded-conversion families before instantiating numerical basal sensitivity arms.
