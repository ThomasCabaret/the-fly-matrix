accepted_claims:
  - Every rewired topology received the same nonbehavioral recipe and budget as the canonical lineage.
  - The resulting per-rewire sets are control ensembles and may be empty without being hidden.
  - The campaign consumes no held-out response and cannot rank the canonical FH-07 members.
forbidden_claims:
