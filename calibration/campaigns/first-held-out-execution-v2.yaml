execution:
  device: cpu
  timestep_s: 0.0001
  record_stride: 20
  direct_motor_abs_max: 0.01
  outcome_storage: append_only_one_shard_per_topology_member
  resume_policy: skip_only_complete_exclusive_created_shards_then_reaccount_all_rows

stimulus_implementation:
  type: environment_owned_kinematic_joint_clamp_not_motor_controller
  target: side_specific_front_femur_tibia_hinge
  extension_sign: measured_from_leg_local_internal_angle_before_outcomes
  baseline_steps: 1000
  ramp_steps: 650
  displacement_deg: 8.0
  release_step: 1650
  post_release_steps: 2000
  sham: identical_clamp_lifecycle_with_zero_displacement_and_paired_random_state

measurement_implementation:
  neural_window: ramp_plus_first_100ms_after_release
  event_populations: event_count_stimulus_minus_paired_sham
  graded_populations: signed_graded_state_time_integral_stimulus_minus_paired_sham
  mixed_native_rule: every_present_native_representation_must_have_positive_effect
  physical_support: >-
    Net leg-local angle opposing the imposed extension from release through the
    end of the locked 200 ms window, minus the paired sham value.
  safety: all arrays finite, command envelope respected, no new failure-mask frames versus sham
  magnitude_threshold: null

analysis:
  canonical_member_side_rule: at_least_7_of_8_expected_direction_pairs
  frozen_rewire_rule: at_least_7_of_8_native_measure_differences_favor_canonical_per_member_side_seed
  recalibrated_rewire_rule: complete_native_ensemble_pass_fraction_per_side_and_rewire_seed
  cardinality_equalization: forbidden
  pooling_across_rewire_seeds: forbidden
  member_ranking: forbidden

outputs:
  outcome_shards: runs/calibration/first-held-out-execution-v2/outcomes/
  compact_result: calibration/runner/first-held-out-execution-v2.yaml
  evaluation: calibration/evaluations/first-held-out-execution-v2.yaml

next_action_by_disposition:
  robust_positive: >-
    Preserve protocol v2 closed and report the topology-specific response. Do not
    promote one member; plan a separately locked replication or orthogonal held-out evaluation.
  member_conditioned_ambiguous: >-
    Preserve the complete partition and attribute disagreements by frozen model
    dimensions. Any repair is a new calibration lineage and requires a new held-out protocol.
  mechanism_limited_ambiguous_neural_without_physical_support: >-
    Keep the neural result separate from the physical failure. Audit motor-class,
    muscle/compliance surrogate and actuator bridge locally before any new calibration.
  mechanism_limited_ambiguous_no_canonical_primary_pass: >-
    Do not tune against this response. Audit stimulus registration, native-class
    assignments and missing mechanisms using independent evidence; any revised
    lineage must receive a new held-out protocol.

accepted_claims:
  - All locked scenarios are executed and accounted without changing parameters.
  - The result may be reported exactly as positive, negative or ambiguous under the locked rules.
forbidden_claims:
  - A member may be selected or calibrated from this outcome.
  - Physical plausibility alone validates MaleCNS or biological motor physiology.
  - A negative result may be hidden or rerun under altered v2 settings.

