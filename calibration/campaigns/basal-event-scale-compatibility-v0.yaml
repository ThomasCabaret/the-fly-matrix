schema_version: 1
id: campaign.basal_event_scale_compatibility.v0
title: Basal event-intensity and event-to-event scale technical compatibility map
status: preregistered_runnable
target_ids:
  - target.population_dynamics_assignment.v0
  - target.technical_embodied_stability.v0
primary_class: technical
optimization_exposure: diagnostic_only
claim_label: EVENT SOURCE/SYNAPTIC SCALE COMPATIBILITY ONLY / ZERO PHYSIOLOGY / NO BEHAVIOR
behavior_targets: []
topology_changes_allowed: false
parameter_values_promoted: 0
population_assignments_promoted: 0

purpose: >-
  Determine whether the previously silent all-event diagnostic is explained by
  incompatibility between event-source intensity and the event-to-event boundary
  scale. Execute a fixed paired grid on the complete basal-reached graph and retain
  every member without ranking. This maps numerical compatibility only; it does
  not estimate a firing rate, synaptic efficacy or physiological range.

scientific_boundary:
  values_are_physiological_bounds: false
  members_may_be_ranked: false
  members_may_be_selected: false
  post_hoc_extension_allowed: false
  named_behavior_may_be_observed: false
  rationale: >-
    The source-rate and synaptic-scale coordinates are explicit engineering probes.
    A threshold crossing proves only that the two fixtures can jointly activate the
    comparator. Silence proves only incompatibility inside this frozen grid. Neither
    outcome supports promotion or retrospective movement of the grid limits.

