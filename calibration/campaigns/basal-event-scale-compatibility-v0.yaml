technical_grid:
  status: UNPROMOTABLE_ENGINEERING_COMPATIBILITY_COORDINATES
  assignment_profile: all_reached_as_event_candidate
  source_shape: uniform_per_terminal
  silence_control: true
  uniform_rate_hz: [20.0, 80.0, 320.0]
  event_to_event_mV: [0.05, 0.2, 0.8, 3.2]
  dt_ms: 0.1
  steps: 960
  duration_ms: 96.0
  seed: 43017
  pairing: same_source_event_draws_across_scales_at_fixed_rate
  members_may_be_ranked: false
  members_may_be_selected: false
  post_hoc_extension_allowed: false
  restriction: >-
    These coordinates are not estimates, priors or admissible physiological bounds.
    The complete grid remains a technical sensitivity record even if it straddles a
    threshold. Any later scientifically bounded grid requires a new sourced campaign.

local_probe:
  scope_id: scope.front_leg_sensor_cns_motor_chain.v0
  populations:
    sensory: 36
    intermediate: 150
    motor: 10
  interpretation: reachability_and_threshold_compatibility_only

acceptance:
  expected_members: 13
  expected_terminals: 6041
  max_event_presence_probability_per_step: 0.05
  require_complete_grid: true
  require_identical_event_draws_across_scales_at_fixed_rate: true
  require_finite_state: true
  require_silence_control_quiescent: true
  threshold_straddling_is_diagnostic_not_required_for_execution_acceptance: true
  require_zero_parameter_and_assignment_promotion: true
  require_zero_member_ranking_or_selection: true
  require_zero_named_behavior_exposure: true

accepted_claims:
  - The complete fixed technical grid executes on the all-event basal-reached graph.
  - At fixed source intensity, every boundary scale receives identical source-event draws.
  - The grid can reveal whether the declared fixtures jointly remain subthreshold or cross the event comparator.
  - A straddled boundary establishes numerical compatibility sensitivity only.
forbidden_claims:
  - Any grid coordinate is a physiological firing rate, synaptic efficacy or accepted bound.
  - The first threshold-crossing coordinate is a selected or preferred parameter.
  - Silence or threshold crossing validates a population assignment, stability or behavior.
  - The grid can be extended after inspection and still be described as this preregistered campaign.

outputs:
  compact_result: calibration/runner/basal-event-scale-compatibility-v0.yaml
  evaluation: calibration/evaluations/basal-event-scale-compatibility-v0.yaml
  parameter_set_index: calibration/parameter_sets/basal-event-scale-technical-grid-v0.yaml
  ignored_diagnostics: data/derived/calibration/basal-event-scale-compatibility-v0/

next_action: >-
  Keep the entire compatibility map unselected. Source or justify scientific
  bounds independently for dominant basal families and local synaptic efficacy.
  If such bounds remain unavailable, carry the technical alternatives into the
  bounded whole-body typed/hybrid sentinel; never choose a coordinate because it
  crosses threshold, moves the body or resembles a named behavior.
