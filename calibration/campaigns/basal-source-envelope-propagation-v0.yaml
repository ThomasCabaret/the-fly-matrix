technical_envelope:
  status: UNPROMOTABLE_ENGINEERING_SENSITIVITY_COORDINATES
  assignment_profiles:
    - exact_event_plus_all_dual_as_graded
    - all_reached_as_event_candidate
  shapes:
    - explicit_silence_control
    - uniform_per_terminal
    - equal_family_mass
  uniform_per_terminal_scales:
    - {id: low, rate_hz: 5.0}
    - {id: reference, rate_hz: 20.0}
    - {id: high, rate_hz: 80.0}
  equal_family_mass_scales:
    - {id: low, family_total_rate_hz: 1250.0}
    - {id: reference, family_total_rate_hz: 2500.0}
    - {id: high, family_total_rate_hz: 5000.0}
  graded_half_saturation_hz: [25.0, 100.0, 400.0]
  ablation_family_ids:
    - parameter.baseline.gustation.v0
    - parameter.baseline.olfaction.v0
    - parameter.baseline.thermohygro.v0
    - parameter.residual_sensory.chemosensory_nominal.v0
    - parameter.residual_sensory.mechanosensory_tbc_nominal.v0
    - parameter.residual_sensory.unknown_nominal.v0
  ablation_reference_uniform_rate_hz: 20.0
  ablation_reference_graded_half_saturation_hz: 100.0
  long_horizon_event_reference:
    uniform_rate_hz: 80.0
    steps: 960
    role: distinguish_short_observation_window_from_event_threshold_or_scale_incompatibility
  steps: 96
  dt_ms: 0.1
  seed: 42017
  restriction: >-
    Rate and half-saturation coordinates span implementation sensitivity only.
    They are neither physiological bounds nor priors and cannot be copied into a
    promoted parameter set. Every member and ablation is retained without ranking.

local_probe:
  scope_id: scope.front_leg_sensor_cns_motor_chain.v0
  populations:
    sensory: 36
    intermediate: 150
    motor: 10
  total_disjoint_neurons: 196
  observables:
    - maximum event-conductance L1
    - maximum graded-state L1
    - maximum absolute local state
    - delta from same-profile silence
  interpretation: propagation_and_sensitivity_only_not_local_function_or_behavior

reproducibility:
  semantic_float_significant_digits: 6
  rationale: >-
    Sparse CUDA reductions may differ in non-scientific trailing bits. Raw
    diagnostics remain stored outside Git. The semantic hash covers exact member
    definitions, seeds/configurations, counts, gates, finitude and nonzero probe
    reachability; it excludes backend-dependent state magnitudes. The versioned
    human summary rounds descriptive magnitudes to three significant digits.

acceptance:
  expected_members: 39
  expected_terminals: 6041
  expected_family_terminals:
    parameter.baseline.gustation.v0: 1428
    parameter.baseline.olfaction.v0: 2639
    parameter.baseline.thermohygro.v0: 91
    parameter.residual_sensory.chemosensory_nominal.v0: 57
    parameter.residual_sensory.mechanosensory_tbc_nominal.v0: 11
    parameter.residual_sensory.unknown_nominal.v0: 1815
  max_event_presence_probability_per_step: 0.05
  require_complete_grid: true
  require_all_six_ablation_probes_per_profile: true
  require_finite_state: true
  require_nonzero_local_chain_propagation_in_at_least_one_non_silence_member: true
  require_zero_parameter_and_assignment_promotion: true
  require_zero_member_ranking_or_selection: true
  require_zero_named_behavior_exposure: true

accepted_claims:
  - A finite engineering envelope spans both candidate source-port profiles and all six families.
  - Every member executes through the full graph and is observed at the frozen 196-neuron local-chain probe.
  - Leave-one-family-out diagnostics expose whether a family, including unknown afferents, materially changes the local probe under the declared fixtures.
  - The complete member list and every result are retained without ranking or selection.
forbidden_claims:
  - The technical coordinates are physiological estimates, priors or accepted bounds.
  - A low-sensitivity ablation proves that a basal family is biologically irrelevant.
  - A high-sensitivity ablation identifies a correct source magnitude or neuronal assignment.
  - Local-chain activity establishes local function, embodied stability or behavior.
  - Either assignment profile is biologically preferred.

outputs:
  compact_result: calibration/runner/basal-source-envelope-propagation-v0.yaml
  evaluation: calibration/evaluations/basal-source-envelope-propagation-v0.yaml
  parameter_set_index: calibration/parameter_sets/basal-source-technical-envelope-v0.yaml
  ignored_diagnostics: data/derived/calibration/basal-source-envelope-propagation-v0/

next_action: >-
  Inspect the preregistered family-ablation sensitivity without ranking members.
  Independently source or justify scientific bounds for the families that dominate
  the local probe; where evidence remains unavailable, carry this finite technical
  uncertainty into the first whole-body typed/hybrid sentinel rather than silently
  choosing one value or population assignment.
