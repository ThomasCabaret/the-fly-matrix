claim_label: BASAL TECHNICAL ENVELOPE / LOCAL-CHAIN PROPAGATION / ZERO PHYSIOLOGY / NO BEHAVIOR
behavior_targets: []
topology_changes_allowed: false
parameter_values_promoted: 0
population_assignments_promoted: 0

purpose: >-
  Execute a finite, behavior-naive engineering envelope for all 6,041 basal
  terminals, preserve both event and graded population alternatives, and observe
  every member at the frozen 196-neuron front-leg chain. The envelope is a
  sensitivity and plumbing gate, not a physiological prior or admissible set.

scientific_boundary:
  numerical_origin: explicit_engineering_sensitivity_coordinates_only
  values_are_physiological_bounds: false
  values_are_literature_transfers: false
  members_may_be_ranked: false
  members_may_be_selected: false
  named_behavior_may_be_observed: false
  rationale: >-
    Current evidence covers partitions but supplies no complete transferable
    numerical table for any family. Finite execution is still useful to expose
    sensitivity, alias failures and whether unresolved afferents dominate the
    first local-chain probe, provided no number is promoted as biology.

