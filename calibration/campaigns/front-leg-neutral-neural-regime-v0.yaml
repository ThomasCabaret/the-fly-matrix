    - a dependency hash or schedule cardinality drift aborts the campaign
    - no grid extension is permitted after observing this campaign

forbidden_observables: [body_pose, body_trajectory, named_action, held_out_response]
accepted_claims:
  - The exact scheduled engineering rows are fully accounted under paired generic FeCO pulse and sham.
  - A nonempty passing set, if present, is a behavior-naive neural technical ensemble for the bounded front-leg cone.
  - Failure modes are attributed to the locked finitude, occupancy, motor-response and recovery checks.
forbidden_claims:
  - A passing row is physiological, preferred, globally stable or a reference lineage.
  - A failing unscheduled FH-06 address has been rejected.
  - A neural pass establishes physical recovery, stance, locomotion or any named behavior.
  - Pairwise factor coverage resolves higher-order compensation or the complete recurrent MaleCNS.

